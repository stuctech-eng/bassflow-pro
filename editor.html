<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BassFlow Editor</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    canvas {
      background: #222;
      margin-top: 20px;
      touch-action: none;
    }
  </style>
</head>
<body>

<h3>BassFlow - Editor</h3>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = 200;

let notes = [];
let ghost = null;

// staff
function drawStaff() {
  ctx.strokeStyle = "white";
  for (let i = 0; i < 5; i++) {
    let y = 60 + i * 15;
    ctx.beginPath();
    ctx.moveTo(10, y);
    ctx.lineTo(canvas.width - 10, y);
    ctx.stroke();
  }
}

// mapping
function getNote(y) {
  const map = [
    { y: 60, note: "F5" },
    { y: 75, note: "D5" },
    { y: 90, note: "B4" },
    { y: 105, note: "G4" },
    { y: 120, note: "E4" },
    { y: 135, note: "C4" }
  ];

  return map.reduce((a, b) =>
    Math.abs(b.y - y) < Math.abs(a.y - y) ? b : a
  );
}

// draw notes
function drawNotes() {
  notes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
  });
}

// ghost note
function drawGhost() {
  if (!ghost) return;

  ctx.beginPath();
  ctx.arc(ghost.x, ghost.y, 6, 0, Math.PI * 2);
  ctx.fillStyle = "gray";
  ctx.fill();
}

// redraw
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawNotes();
  drawGhost();
}

// touch move (ghost)
canvas.addEventListener("touchmove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];

  const x = touch.clientX - rect.left;
  const y = touch.clientY - rect.top;

  const snapped = getNote(y);

  ghost = {
    x: x,
    y: snapped.y,
    note: snapped.note
  };

  draw();
});

// touch end (plaats noot)
canvas.addEventListener("touchend", () => {
  if (ghost) {
    notes.push(ghost);
    ghost = null;
    draw();
    console.log(notes);
  }
});

// klik fallback
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const snapped = getNote(y);

  notes.push({
    x: x,
    y: snapped.y,
    note: snapped.note
  });

  draw();
});

draw();
</script>

</body>
</html>
