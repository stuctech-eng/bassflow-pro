<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>BassFlow Pro - Clean Edition</title>
  <style>
    :root { --accent: #00d4ff; --bg: #0d0d0d; }
    body { 
      margin: 0; background: var(--bg); color: white; font-family: -apple-system, sans-serif; 
      overflow: hidden; touch-action: none; -webkit-user-select: none;
    }

    /* Floating Menu Style */
    #noteMenu {
      position: absolute; display: none; background: rgba(30, 30, 30, 0.95);
      border: 1px solid var(--accent); border-radius: 12px; padding: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 100; backdrop-filter: blur(5px);
    }
    .menu-row { display: flex; gap: 8px; margin-bottom: 8px; justify-content: center; }
    .menu-btn { 
      background: #333; color: white; border: none; padding: 10px; 
      border-radius: 6px; min-width: 44px; font-size: 18px;
    }
    .menu-btn.active { background: var(--accent); color: black; }

    canvas { display: block; background: #111; margin: 0 auto; }
    
    .bottom-bar { 
      position: fixed; bottom: 0; width: 100%; height: 60px;
      display: flex; justify-content: space-around; align-items: center;
      background: #1a1a1a; border-top: 1px solid #333;
    }
    .main-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 8px 20px; border-radius: 20px; font-weight: bold; }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="noteMenu">
  <div class="menu-row">
    <button class="menu-btn" onclick="updateSelectedNote('dur', 512)">𝅝</button>
    <button class="menu-btn" onclick="updateSelectedNote('dur', 256)">𝅗𝅥</button>
    <button class="menu-btn" onclick="updateSelectedNote('dur', 128)">𝅘𝅥</button>
    <button class="menu-btn" onclick="updateSelectedNote('dur', 64)">𝅘𝅥𝅮</button>
  </div>
  <div class="menu-row">
    <button class="menu-btn" onclick="updateSelectedNote('type', 'rest')">𝄽 (Rust)</button>
    <button class="menu-btn" style="background:#ff4444" onclick="deleteNote()">🗑️</button>
  </div>
  <button class="main-btn" style="width:100%" onclick="closeMenu()">KLAAR</button>
</div>

<div class="bottom-bar">
  <button class="main-btn" onclick="clearNotes()">CLEAR</button>
  <button id="playBtn" class="main-btn" onclick="togglePlayback()">PLAY</button>
  <button class="main-btn" style="border-color:#ffaa00; color:#ffaa00" onclick="exportMIDI()">MIDI</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
const noteMenu = document.getElementById("noteMenu");

canvas.width = window.innerWidth; canvas.height = window.innerHeight - 60;

let notes = [], ghost = null, isTouching = false, selectedNote = null;
let isPlaying = false, currentBeat = 0, playbackInterval;

const step = 14, staffTop = 100, tabTop = 300, beatWidth = 55, startMargin = 70;
const noteMap = ["g/3","f/3","e/3","d/3","c/3","b/2","a/2","g/2","f/2","e/2","d/2","c/2","b/1","a/1","g/1","f/1","e/1"];
const midiPitches = {"g/3":55,"f/3":53,"e/3":52,"d/3":50,"c/3":48,"b/2":47,"a/2":45,"g/2":43,"f/2":41,"e/2":40,"d/2":38,"c/2":36,"b/1":35,"a/1":33,"g/1":31,"f/1":29,"e/1":28};

// --- CORE ENGINE ---
function draw() {
  ctx.clearRect(0,0,canvas.width, canvas.height);
  
  // Grid & Maatlijnen
  for(let b=0; b<32; b++) {
    let x = startMargin + (b * beatWidth);
    ctx.strokeStyle = (b % 4 === 0) ? "#555" : "#222";
    ctx.beginPath(); ctx.moveTo(x, 50); ctx.lineTo(x, 450); ctx.stroke();
  }

  // Notenbalk & TAB
  ctx.strokeStyle = "#444";
  [5,7,9,11,13].forEach(i => {
    let y = staffTop + (i*7);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  });

  // Noten tekenen
  notes.forEach(n => {
    ctx.globalAlpha = (n.type === 'rest') ? 0.3 : 1.0;
    ctx.beginPath();
    ctx.ellipse(n.x, n.y, 7, 5, -0.7, 0, 7);
    if(n.duration >= 256) { ctx.strokeStyle="white"; ctx.stroke(); } else { ctx.fillStyle="white"; ctx.fill(); }
    
    // Stok
    if(n.duration < 512) {
      ctx.beginPath(); ctx.strokeStyle="white";
      let dir = n.index <= 9 ? 1 : -1;
      ctx.moveTo(n.x+(6*-dir), n.y); ctx.lineTo(n.x+(6*-dir), n.y+(30*dir)); ctx.stroke();
    }
    ctx.globalAlpha = 1.0;
  });

  if (isPlaying) {
    ctx.strokeStyle = "#ffaa00"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(startMargin + (currentBeat * beatWidth), 50); ctx.lineTo(startMargin + (currentBeat * beatWidth), 450); ctx.stroke();
  }

  if(ghost) {
    ctx.fillStyle = "rgba(0, 212, 255, 0.4)";
    ctx.beginPath(); ctx.ellipse(ghost.x, ghost.y, 7, 5, -0.7, 0, 7); ctx.fill();
  }

  requestAnimationFrame(draw);
}

// --- INTERACTIE ---
canvas.addEventListener("pointerdown", (e) => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const rect = canvas.getBoundingClientRect();
  const b = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
  const p = Math.max(0, Math.min(noteMap.length - 1, Math.round((e.clientY - rect.top - 80 - staffTop) / 7)));
  
  // Check of we op een bestaande noot tikken voor het menu
  const hit = notes.find(n => n.beat === b && n.index === p);
  if (hit) {
    selectedNote = hit;
    showMenu(e.clientX, e.clientY);
    return;
  }

  isTouching = true;
  ghost = { x: startMargin + (b * beatWidth), y: staffTop + p * 7, beat: b, index: p, note: noteMap[p], duration: 128, type: 'note' };
});

canvas.addEventListener("pointermove", (e) => {
  if(!isTouching) return;
  const rect = canvas.getBoundingClientRect();
  const b = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
  const p = Math.max(0, Math.min(noteMap.length - 1, Math.round((e.clientY - rect.top - 80 - staffTop) / 7)));
  ghost.x = startMargin + (b * beatWidth);
  ghost.y = staffTop + p * 7;
  ghost.beat = b;
  ghost.index = p;
  ghost.note = noteMap[p];
});

canvas.addEventListener("pointerup", () => {
  if(isTouching && ghost) {
    notes.push({...ghost});
    ghost = null;
  }
  isTouching = false;
});

// --- MENU FUNCTIES ---
function showMenu(x, y) {
  noteMenu.style.display = "block";
  noteMenu.style.left = Math.min(x, window.innerWidth - 150) + "px";
  noteMenu.style.top = Math.min(y, window.innerHeight - 200) + "px";
}

function closeMenu() { noteMenu.style.display = "none"; selectedNote = null; }

function updateSelectedNote(prop, val) {
  if(!selectedNote) return;
  selectedNote[prop] = val;
  if(prop === 'dur') selectedNote.duration = val;
}

function deleteNote() {
  notes = notes.filter(n => n !== selectedNote);
  closeMenu();
}

function clearNotes() { notes = []; }

function togglePlayback() {
  if (isPlaying) { clearInterval(playbackInterval); isPlaying = false; }
  else {
    isPlaying = true; currentBeat = 0;
    playbackInterval = setInterval(() => {
      notes.filter(n => n.beat === currentBeat && n.type !== 'rest').forEach(n => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = frequencies[n.note];
        osc.type = 'triangle';
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      });
      currentBeat++; if(currentBeat > 31) currentBeat = 0;
    }, 400);
  }
}

// ... MIDI Export blijft hetzelfde ...

const frequencies = {"g/3":196.0,"f/3":174.61,"e/3":164.81,"d/3":146.83,"c/3":130.81,"b/2":123.47,"a/2":110.0,"g/2":98.0,"f/2":87.31,"e/2":82.41,"d/2":73.42,"c/2":65.41,"b/1":61.74,"a/1":55.0,"g/1":49.0,"f/1":43.65,"e/1":41.2};

draw();
</script>
</body>
</html>
