<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>BassFlow Editor</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
    }

    canvas {
      background: #222;
      margin-top: 20px;
      touch-action: none;
    }
  </style>
</head>
<body>

<h3>BassFlow - Editor</h3>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = 220;

let notes = [];
let ghost = null;
let isTouching = false;

// staff
function drawStaff() {
  ctx.strokeStyle = "white";
  for (let i = 0; i < 5; i++) {
    let y = 80 + i * 15;
    ctx.beginPath();
    ctx.moveTo(10, y);
    ctx.lineTo(canvas.width - 10, y);
    ctx.stroke();
  }
}

// mapping
function getNote(y) {
  const map = [
    { y: 80, note: "F5" },
    { y: 95, note: "D5" },
    { y: 110, note: "B4" },
    { y: 125, note: "G4" },
    { y: 140, note: "E4" },
    { y: 155, note: "C4" }
  ];

  return map.reduce((a, b) =>
    Math.abs(b.y - y) < Math.abs(a.y - y) ? b : a
  );
}

// notes
function drawNotes() {
  notes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
  });
}

// ghost (met offset)
function drawGhost() {
  if (!ghost) return;

  ctx.beginPath();
  ctx.arc(ghost.x, ghost.y, 6, 0, Math.PI * 2);
  ctx.fillStyle = "gray";
  ctx.fill();
}

// loop
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawNotes();
  drawGhost();
  requestAnimationFrame(loop);
}
loop();

// touch start
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  isTouching = true;
});

// touch move
canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();

  if (!isTouching) return;

  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];

  const x = touch.clientX - rect.left;
  const y = touch.clientY - rect.top;

  const snapped = getNote(y);

  ghost = {
    x: x,
    y: snapped.y - 35,   // 👈 zichtbaar boven je vinger
    realY: snapped.y,    // 👈 echte positie
    note: snapped.note
  };
});

// touch end
canvas.addEventListener("touchend", (e) => {
  e.preventDefault();

  if (ghost) {
    notes.push({
      x: ghost.x,
      y: ghost.realY, // 👈 juiste plek op balk
      note: ghost.note
    });

    ghost = null;
  }

  isTouching = false;
});

// click fallback
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const snapped = getNote(y);

  notes.push({
    x: x,
    y: snapped.y,
    note: snapped.note
  });
});
</script>

</body>
</html>
