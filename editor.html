<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>BassFlow Pro - OMR & TAB</title>
  <style>
    body { margin: 0; background: #0d0d0d; color: white; font-family: sans-serif; text-align: center; overflow: hidden; overscroll-behavior-y: contain; }
    h3 { margin: 10px 0; color: #00d4ff; text-transform: uppercase; letter-spacing: 2px; font-size: 16px; }
    canvas { background: #151515; display: block; margin: 0 auto; touch-action: none; border-bottom: 2px solid #333; cursor: crosshair; }
    .controls { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 10px; }
    button, label { background: #222; color: #00d4ff; border: 1px solid #00d4ff; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    button:active, label:active { background: #00d4ff; color: black; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<h3>BassFlow Pro Editor</h3>
<canvas id="canvas"></canvas>

<div class="controls">
  <button onclick="clearNotes()">CLEAR</button>
  <button id="playBtn" onclick="togglePlayback()">PLAY</button>
  <label for="omr-upload">📷 OMR IMPORT</label>
  <input type="file" id="omr-upload" accept="image/*">
  <button onclick="adjustOpacity()">DIM IMAGE</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let isPlaying = false, currentBeat = 0, playbackInterval, omrImage = null, omrOpacity = 0.4;

const frequencies = {
  "g/3": 196.00, "f/3": 174.61, "e/3": 164.81, "d/3": 146.83, "c/3": 130.81,
  "b/2": 123.47, "a/2": 110.00, "g/2": 98.00, "f/2": 87.31, "e/2": 82.41,
  "d/2": 73.42, "c/2": 65.41, "b/1": 61.74, "a/1": 55.00, "g/1": 49.00,
  "f/1": 43.65, "e/1": 41.20
};

const tabMap = {
  "g/3": {s:1, f:12}, "f/3": {s:1, f:10}, "e/3": {s:1, f:9}, "d/3": {s:1, f:7}, "c/3": {s:1, f:5},
  "b/2": {s:1, f:4}, "a/2": {s:1, f:2}, "g/2": {s:1, f:0}, "f/2": {s:2, f:3}, "e/2": {s:2, f:2},
  "d/2": {s:2, f:0}, "c/2": {s:3, f:3}, "b/1": {s:3, f:2}, "a/1": {s:3, f:0}, "g/1": {s:4, f:3},
  "f/1": {s:4, f:1}, "e/1": {s:4, f:0}
};

const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = 480;

let notes = [], ghost = null, isTouching = false;
const step = 14, staffTop = 80, tabTop = 280, beatWidth = 55, startMargin = 85;
const noteMap = ["g/3","f/3","e/3","d/3","c/3","b/2","a/2","g/2","f/2","e/2","d/2","c/2","b/1","a/1","g/1","f/1","e/1"];

// --- OMR LOGICA ---
document.getElementById('omr-upload').addEventListener('change', function(e) {
  const reader = new FileReader();
  reader.onload = function(event) {
    omrImage = new Image();
    omrImage.onload = () => { loop(); };
    omrImage.src = event.target.result;
  };
  reader.readAsDataURL(e.target.files[0]);
});

function adjustOpacity() { omrOpacity = omrOpacity < 0.2 ? 0.7 : omrOpacity - 0.2; }

function drawStaff() {
  // 1. Teken OMR Image op de achtergrond
  if (omrImage) {
    ctx.save();
    ctx.globalAlpha = omrOpacity;
    // Schaal afbeelding naar breedte van canvas
    const ratio = omrImage.height / omrImage.width;
    ctx.drawImage(omrImage, 0, 20, canvas.width, canvas.width * ratio);
    ctx.restore();
  }

  // 2. Verticale Grid Lijnen (Ritmische slots) - NU LICHTER (#444)
  ctx.strokeStyle = "#444";
  ctx.lineWidth = 1;
  for (let b = 0; b < 24; b++) {
    let x = startMargin + (b * beatWidth);
    // Maatstreep om de 4 beats
    ctx.strokeStyle = (b % 4 === 0) ? "#888" : "#333";
    ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, 400); ctx.stroke();
  }

  // 3. Notenbalk (F-sleutel)
  ctx.strokeStyle = "#aaa";
  [5, 7, 9, 11, 13].forEach(index => {
    let y = staffTop + (index * (step / 2));
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  });

  // 4. TAB Balk
  ctx.strokeStyle = "#555";
  [0, 1, 2, 3].forEach(i => {
    let y = tabTop + (i * 20);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  });

  // 5. Cursor
  if (isPlaying) {
    ctx.strokeStyle = "#00d4ff"; ctx.lineWidth = 3;
    const x = startMargin + (currentBeat * beatWidth);
    ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, 400); ctx.stroke();
    ctx.lineWidth = 1;
  }
}

// ... (Rest van de functies zoals playBassTone, drawNotes, drawLedgerLines blijven hetzelfde) ...
function playBassTone(noteName) {
  if (!frequencies[noteName]) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(frequencies[noteName], audioCtx.currentTime);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

function drawNotes() {
  notes.forEach(n => {
    // 1. Teken de noot op de balk
    drawLedgerLines(n.x, n.index);
    ctx.beginPath(); 
    ctx.ellipse(n.x, n.y, 7, 5, -0.7, 0, 7);
    ctx.fillStyle = "white"; 
    ctx.fill();
    
    // 2. Teken de stok (iets korter bij akkoorden)
    ctx.beginPath(); ctx.lineWidth = 1.5; ctx.strokeStyle = "white";
    if (n.index <= 9) { ctx.moveTo(n.x - 6, n.y); ctx.lineTo(n.x - 6, n.y + 30); }
    else { ctx.moveTo(n.x + 6, n.y); ctx.lineTo(n.x + 6, n.y - 30); }
    ctx.stroke();

    // 3. Teken de TAB (nu multi-note proof)
    const tab = tabMap[n.note];
    if (tab) {
        const tabY = tabTop + ((tab.s - 1) * 20);
        // Wit vierkantje om de lijn achter het cijfer te wissen
        ctx.fillStyle = "#151515"; 
        ctx.fillRect(n.x - 8, tabY - 8, 16, 16);
        // Het fretnummer
        ctx.fillStyle = "#00d4ff";
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "center";
        ctx.fillText(tab.f, n.x, tabY + 5);
    }
  });
}


function drawLedgerLines(x, index) {
  ctx.strokeStyle = "white"; ctx.lineWidth = 1.5;
  if (index < 5) { for (let i = 3; i >= index; i -= 2) {
      let ly = staffTop + (i * (step/2));
      ctx.beginPath(); ctx.moveTo(x - 15, ly); ctx.lineTo(x + 15, ly); ctx.stroke();
  }}
  if (index > 13) { for (let i = 15; i <= index; i += 2) {
      let ly = staffTop + (i * (step/2));
      ctx.beginPath(); ctx.moveTo(x - 15, ly); ctx.lineTo(x + 15, ly); ctx.stroke();
  }}
}

function togglePlayback() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (isPlaying) { clearInterval(playbackInterval); isPlaying = false; document.getElementById("playBtn").innerText = "PLAY"; }
  else {
    isPlaying = true; currentBeat = 0; document.getElementById("playBtn").innerText = "STOP";
    const first = notes.find(n => n.beat === 0); if (first) playBassTone(first.note);
    playbackInterval = setInterval(() => {
      currentBeat++; if (currentBeat > 20) currentBeat = 0;
      const n = notes.find(n => n.beat === currentBeat); if (n) playBassTone(n.note);
    }, 500);
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  if (ghost) {
    ctx.save(); ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(ghost.x, ghost.y, 7, 5, -0.7, 0, 7);
    ctx.fillStyle = "#00d4ff"; ctx.fill(); ctx.restore();
  }
  drawNotes();
  requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown", (e) => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  isTouching = true;
  const rect = canvas.getBoundingClientRect();
  const bIdx = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
  const pIdx = Math.round((e.clientY - rect.top - 75 - staffTop) / (step / 2));
  const p = Math.max(0, Math.min(noteMap.length - 1, pIdx));
  ghost = { x: startMargin + (bIdx * beatWidth), y: staffTop + p * (step / 2), note: noteMap[p], index: p, beat: bIdx };
  playBassTone(ghost.note);
});

canvas.addEventListener("pointermove", (e) => {
  if (!isTouching) return;
  const rect = canvas.getBoundingClientRect();
  const bIdx = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
  const pIdx = Math.round((e.clientY - rect.top - 75 - staffTop) / (step / 2));
  const p = Math.max(0, Math.min(noteMap.length - 1, pIdx));
  let nG = { x: startMargin + (bIdx * beatWidth), y: staffTop + p * (step / 2), note: noteMap[p], index: p, beat: bIdx };
  if (ghost && nG.note !== ghost.note) playBassTone(nG.note);
  ghost = nG;
});

// Zoek deze sectie in je 'pointerup' event listener en vervang hem:

canvas.addEventListener("pointerup", () => {
  if (isTouching && ghost) {
    // Check of PRECIES deze noot al bestaat op deze beat
    const existingNoteIndex = notes.findIndex(
      n => n.beat === ghost.beat && n.note === ghost.note
    );

    if (existingNoteIndex !== -1) {
      // Als de noot al bestaat: verwijder hem (toggle/gum functie)
      notes.splice(existingNoteIndex, 1);
    } else {
      // Als hij nog niet bestaat: voeg hem toe aan de stapel
      notes.push(ghost);
    }
    
    notes.sort((a, b) => a.beat - b.beat);
    ghost = null;
  }
  isTouching = false;
});


function clearNotes() { notes = []; }
loop();
</script>
</body>
</html>
