<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>BassFlow Pro - Full Editor</title>
  <style>
    :root { --accent: #00d4ff; --bg: #0d0d0d; --panel: #1a1a1a; }
    body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; text-align: center; overflow: hidden; touch-action: none; }
    h3 { margin: 8px 0; color: var(--accent); font-size: 14px; letter-spacing: 1px; }
    
    canvas { background: var(--panel); display: block; margin: 0 auto; border-bottom: 2px solid #333; }

    .toolbar { display: flex; justify-content: center; gap: 5px; padding: 10px; background: #222; flex-wrap: wrap; }
    .toolbar button { 
      background: #333; color: white; border: 1px solid #555; padding: 8px 12px; 
      border-radius: 4px; font-size: 18px; cursor: pointer; min-width: 45px;
    }
    .toolbar button.active { background: var(--accent); color: black; border-color: white; }
    
    .main-controls { display: flex; justify-content: center; gap: 10px; padding: 10px; background: #111; }
    .main-controls button { 
      background: transparent; color: var(--accent); border: 1px solid var(--accent); 
      padding: 8px 15px; border-radius: 6px; font-weight: bold;
    }
    .midi-btn { border-color: #ffaa00 !important; color: #ffaa00 !important; }
  </style>
</head>
<body>

<h3>BASSFLOW PRO EDITOR</h3>

<div class="toolbar" id="noteToolbar">
  <button onclick="setDur(512, this)">𝅝</button> <button onclick="setDur(256, this)">𝅗𝅥</button> <button class="active" onclick="setDur(128, this)">𝅘𝅥</button> <button onclick="setDur(64, this)">𝅘𝅥𝅮</button> <button onclick="setMode('erase', this)" style="margin-left:15px;">🧽</button>
</div>

<canvas id="canvas"></canvas>

<div class="main-controls">
  <button onclick="clearNotes()">CLEAR</button>
  <button id="playBtn" onclick="togglePlayback()">PLAY</button>
  <button class="midi-btn" onclick="exportMIDI()">⬇️ MIDI</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let isPlaying = false, currentBeat = 0, playbackInterval, omrImage = null;
let currentDuration = 128; // Default kwart
let editMode = 'draw'; // 'draw' of 'erase'

const frequencies = {
  "g/3": 196.00, "f/3": 174.61, "e/3": 164.81, "d/3": 146.83, "c/3": 130.81,
  "b/2": 123.47, "a/2": 110.00, "g/2": 98.00, "f/2": 87.31, "e/2": 82.41,
  "d/2": 73.42, "c/2": 65.41, "b/1": 61.74, "a/1": 55.00, "g/1": 49.00, "f/1": 43.65, "e/1": 41.20
};

const midiPitches = {
  "g/3": 55, "f/3": 53, "e/3": 52, "d/3": 50, "c/3": 48, "b/2": 47, "a/2": 45, "g/2": 43, 
  "f/2": 41, "e/2": 40, "d/2": 38, "c/2": 36, "b/1": 35, "a/1": 33, "g/1": 31, "f/1": 29, "e/1": 28
};

const tabMap = {
  "g/3": {s:1, f:12}, "f/3": {s:1, f:10}, "e/3": {s:1, f:9}, "d/3": {s:1, f:7}, "c/3": {s:1, f:5},
  "b/2": {s:1, f:4}, "a/2": {s:1, f:2}, "g/2": {s:1, f:0}, "f/2": {s:2, f:3}, "e/2": {s:2, f:2},
  "d/2": {s:2, f:0}, "c/2": {s:3, f:3}, "b/1": {s:3, f:2}, "a/1": {s:3, f:0}, "g/1": {s:4, f:3},
  "f/1": {s:4, f:1}, "e/1": {s:4, f:0}
};

const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = 440;
let notes = [], ghost = null, isTouching = false;
const step = 14, staffTop = 70, tabTop = 270, beatWidth = 50, startMargin = 70;
const noteMap = ["g/3","f/3","e/3","d/3","c/3","b/2","a/2","g/2","f/2","e/2","d/2","c/2","b/1","a/1","g/1","f/1","e/1"];

function setDur(d, btn) {
  currentDuration = d; editMode = 'draw';
  updateActiveBtn(btn);
}

function setMode(m, btn) {
  editMode = m;
  updateActiveBtn(btn);
}

function updateActiveBtn(btn) {
  document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function drawStaff() {
  ctx.strokeStyle = "#333";
  for (let b = 0; b < 32; b++) {
    let x = startMargin + (b * beatWidth);
    ctx.strokeStyle = (b % 4 === 0) ? "#666" : "#222";
    ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x, 400); ctx.stroke();
  }
  ctx.strokeStyle = "#888";
  [5, 7, 9, 11, 13].forEach(i => {
    let y = staffTop + (i * 7);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  });
  ctx.strokeStyle = "#444";
  [0, 1, 2, 3].forEach(i => {
    let y = tabTop + (i * 20);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  });
  if (isPlaying) {
    ctx.strokeStyle = "#ffaa00"; ctx.lineWidth = 2;
    const x = startMargin + (currentBeat * beatWidth);
    ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x, 400); ctx.stroke();
    ctx.lineWidth = 1;
  }
}

function drawNotes() {
  notes.forEach(n => {
    // Ledgers
    if (n.index < 5 || n.index > 13) drawLedgers(n.x, n.index);
    
    // Nootkop
    ctx.beginPath();
    ctx.ellipse(n.x, n.y, 7, 5, -0.7, 0, 7);
    if (n.duration >= 256) { // Hele/Halve zijn open
      ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
    } else {
      ctx.fillStyle = "white"; ctx.fill();
    }

    // Stok (Niet bij hele noten)
    if (n.duration < 512) {
      ctx.beginPath(); ctx.strokeStyle = "white"; ctx.lineWidth = 1.5;
      let dir = (n.index <= 9) ? 1 : -1;
      ctx.moveTo(n.x + (6 * -dir), n.y);
      ctx.lineTo(n.x + (6 * -dir), n.y + (30 * dir));
      ctx.stroke();
      
      // Vlaggetje voor achtste
      if (n.duration <= 64) {
        ctx.beginPath();
        ctx.moveTo(n.x + (6 * -dir), n.y + (30 * dir));
        ctx.lineTo(n.x + (dir * 12), n.y + (dir * 15));
        ctx.stroke();
      }
    }

    // TAB
    const t = tabMap[n.note];
    if (t) {
      const ty = tabTop + ((t.s - 1) * 20);
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(n.x - 8, ty - 8, 16, 16);
      ctx.fillStyle = (editMode === 'erase') ? "#ff4444" : varColor(n.duration);
      ctx.font = "bold 13px Arial"; ctx.textAlign = "center";
      ctx.fillText(t.f, n.x, ty + 5);
    }
  });
}

function varColor(d) {
    if(d === 512) return "#ff00ff";
    if(d === 64) return "#00d4ff";
    return "white";
}

function drawLedgers(x, index) {
  ctx.strokeStyle = "white"; ctx.lineWidth = 1.5;
  if (index < 5) for (let i = 3; i >= index; i -= 2) {
    let ly = staffTop + (i * 7); ctx.beginPath(); ctx.moveTo(x - 12, ly); ctx.lineTo(x + 12, ly); ctx.stroke();
  }
  if (index > 13) for (let i = 15; i <= index; i += 2) {
    let ly = staffTop + (i * 7); ctx.beginPath(); ctx.moveTo(x - 12, ly); ctx.lineTo(x + 12, ly); ctx.stroke();
  }
}

function playBassTone(noteName) {
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'triangle'; osc.frequency.setValueAtTime(frequencies[noteName], audioCtx.currentTime);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

function togglePlayback() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (isPlaying) { clearInterval(playbackInterval); isPlaying = false; document.getElementById("playBtn").innerText = "PLAY"; }
  else {
    isPlaying = true; currentBeat = 0; document.getElementById("playBtn").innerText = "STOP";
    const play = () => notes.filter(n => n.beat === currentBeat).forEach(h => playBassTone(h.note));
    play();
    playbackInterval = setInterval(() => { currentBeat++; if (currentBeat > 31) currentBeat = 0; play(); }, 400);
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  if (ghost && editMode === 'draw') {
    ctx.save(); ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.ellipse(ghost.x, ghost.y, 7, 5, -0.7, 0, 7);
    ctx.fillStyle = varColor(currentDuration); ctx.fill(); ctx.restore();
  }
  drawNotes();
  requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown", (e) => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  isTouching = true; canvas.setPointerCapture(e.pointerId);
  const rect = canvas.getBoundingClientRect();
  const b = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
  const p = Math.max(0, Math.min(noteMap.length - 1, Math.round((e.clientY - rect.top - 70 - staffTop) / 7)));
  ghost = { x: startMargin + (b * beatWidth), y: staffTop + p * 7, note: noteMap[p], index: p, beat: b, duration: currentDuration };
  if(editMode === 'draw') playBassTone(ghost.note);
});

canvas.addEventListener("pointerup", () => {
  if (isTouching && ghost) {
    const idx = notes.findIndex(n => n.beat === ghost.beat && n.note === ghost.note);
    if (editMode === 'erase') {
        if (idx !== -1) notes.splice(idx, 1);
    } else {
        if (idx === -1) notes.push({...ghost});
    }
    ghost = null;
  }
  isTouching = false;
});

function clearNotes() { notes = []; }
function exportMIDI() {
  const header = [0x4d, 0x54, 0x68, 0x64, 0,0,0,6, 0,0, 0,1, 0,0x80];
  let events = [];
  let lastT = 0;
  notes.sort((a,b)=>a.beat-b.beat).forEach(n => {
    let t = n.beat * 128;
    events.push(t-lastT, 0x90, midiPitches[n.note], 64);
    events.push(n.duration, 0x80, midiPitches[n.note], 0);
    lastT = t + n.duration;
  });
  events.push(0, 0xff, 0x2f, 0);
  const file = new Uint8Array([...header, 0x4d, 0x54, 0x72, 0x6b, 0,0,0,events.length, ...events]);
  const blob = new Blob([file], {type:"audio/midi"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download="bass.mid"; a.click();
}

loop();
</script>
</body>
</html>
