<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>BassFlow Pro - MIDI Export</title>
  <style>
    body { margin: 0; background: #0d0d0d; color: white; font-family: sans-serif; text-align: center; overflow: hidden; overscroll-behavior-y: contain; }
    h3 { margin: 10px 0; color: #00d4ff; text-transform: uppercase; letter-spacing: 2px; font-size: 16px; }
    canvas { background: #151515; display: block; margin: 0 auto; touch-action: none; border-bottom: 2px solid #333; }
    .controls { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 10px; }
    button, label { background: #222; color: #00d4ff; border: 1px solid #00d4ff; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .midi-btn { border-color: #ffaa00; color: #ffaa00; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<h3>BassFlow Pro Editor</h3>
<canvas id="canvas"></canvas>

<div class="controls">
  <button onclick="clearNotes()">CLEAR</button>
  <button id="playBtn" onclick="togglePlayback()">PLAY</button>
  <label for="omr-upload">📷 OMR</label>
  <input type="file" id="omr-upload" accept="image/*">
  <button class="midi-btn" onclick="exportMIDI()">⬇️ EXPORT MIDI</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let isPlaying = false, currentBeat = 0, playbackInterval, omrImage = null;

const frequencies = {
  "g/3": 196.00, "f/3": 174.61, "e/3": 164.81, "d/3": 146.83, "c/3": 130.81,
  "b/2": 123.47, "a/2": 110.00, "g/2": 98.00, "f/2": 87.31, "e/2": 82.41,
  "d/2": 73.42, "c/2": 65.41, "b/1": 61.74, "a/1": 55.00, "g/1": 49.00, "f/1": 43.65, "e/1": 41.20
};

// MIDI Pitch Mapping
const midiPitches = {
  "g/3": 55, "f/3": 53, "e/3": 52, "d/3": 50, "c/3": 48, "b/2": 47, "a/2": 45, "g/2": 43, 
  "f/2": 41, "e/2": 40, "d/2": 38, "c/2": 36, "b/1": 35, "a/1": 33, "g/1": 31, "f/1": 29, "e/1": 28
};

const tabMap = {
  "g/3": {s:1, f:12}, "f/3": {s:1, f:10}, "e/3": {s:1, f:9}, "d/3": {s:1, f:7}, "c/3": {s:1, f:5},
  "b/2": {s:1, f:4}, "a/2": {s:1, f:2}, "g/2": {s:1, f:0}, "f/2": {s:2, f:3}, "e/2": {s:2, f:2},
  "d/2": {s:2, f:0}, "c/2": {s:3, f:3}, "b/1": {s:3, f:2}, "a/1": {s:3, f:0}, "g/1": {s:4, f:3},
  "f/1": {s:4, f:1}, "e/1": {s:4, f:0}
};

const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = 460;
let notes = [], ghost = null, isTouching = false;
const step = 14, staffTop = 80, tabTop = 280, beatWidth = 55, startMargin = 85;
const noteMap = ["g/3","f/3","e/3","d/3","c/3","b/2","a/2","g/2","f/2","e/2","d/2","c/2","b/1","a/1","g/1","f/1","e/1"];

// --- MIDI EXPORT ENGINE ---
function exportMIDI() {
  if (notes.length === 0) return alert("Zet eerst wat noten neer!");
  
  // Eenvoudige MIDI File generator (Format 0)
  const header = [0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x80];
  let trackData = [0x4d, 0x54, 0x72, 0x6b];
  let events = [];

  // Sorteer noten op beat
  const sorted = [...notes].sort((a, b) => a.beat - b.beat);
  
  let lastTick = 0;
  sorted.forEach(n => {
    let tick = n.beat * 128;
    let delta = tick - lastTick;
    let pitch = midiPitches[n.note];
    
    // Note ON
    events.push(0x00, 0x90, pitch, 0x64);
    // Note OFF (na een kwartnoot)
    events.push(0x81, 0x00, 0x80, pitch, 0x00);
    lastTick = tick + 128;
  });
  
  // End of Track
  events.push(0x01, 0xff, 0x2f, 0x00);
  
  const len = events.length;
  const size = [ (len >> 24) & 0xff, (len >> 16) & 0xff, (len >> 8) & 0xff, len & 0xff ];
  const fullFile = new Uint8Array([...header, ...trackData, ...size, ...events]);
  
  const blob = new Blob([fullFile], {type: "audio/midi"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "bassline.mid";
  link.click();
}

// --- REST VAN DE LOGICA ---
function drawStaff() {
  if (omrImage) {
    ctx.save(); ctx.globalAlpha = 0.4;
    const ratio = omrImage.height / omrImage.width;
    ctx.drawImage(omrImage, 0, 20, canvas.width, canvas.width * ratio);
    ctx.restore();
  }
  ctx.strokeStyle = "#333";
  for (let b = 0; b < 24; b++) {
    let x = startMargin + (b * beatWidth);
    ctx.strokeStyle = (b % 4 === 0) ? "#666" : "#222";
    ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, 400); ctx.stroke();
  }
  ctx.strokeStyle = "#888";
  [5, 7, 9, 11, 13].forEach(i => {
    let y = staffTop + (i * 7);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  });
  ctx.strokeStyle = "#444";
  [0, 1, 2, 3].forEach(i => {
    let y = tabTop + (i * 20);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  });
  if (isPlaying) {
    ctx.strokeStyle = "#ffaa00"; ctx.lineWidth = 2;
    const x = startMargin + (currentBeat * beatWidth);
    ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, 400); ctx.stroke();
  }
}

function drawNotes() {
  notes.forEach(n => {
    // Noot op balk
    ctx.beginPath(); ctx.ellipse(n.x, n.y, 7, 5, -0.7, 0, 7);
    ctx.fillStyle = "white"; ctx.fill();
    ctx.beginPath(); ctx.strokeStyle = "white";
    if (n.index <= 9) { ctx.moveTo(n.x - 6, n.y); ctx.lineTo(n.x - 6, n.y + 30); }
    else { ctx.moveTo(n.x + 6, n.y); ctx.lineTo(n.x + 6, n.y - 30); }
    ctx.stroke();

    // Fret op TAB
    const t = tabMap[n.note];
    if (t) {
      const ty = tabTop + ((t.s - 1) * 20);
      ctx.fillStyle = "#151515"; ctx.fillRect(n.x - 8, ty - 8, 16, 16);
      ctx.fillStyle = "#00d4ff"; ctx.font = "bold 13px Arial"; ctx.textAlign = "center";
      ctx.fillText(t.f, n.x, ty + 5);
    }
  });
}

function playBassTone(noteName) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(frequencies[noteName], audioCtx.currentTime);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

function togglePlayback() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (isPlaying) { clearInterval(playbackInterval); isPlaying = false; document.getElementById("playBtn").innerText = "PLAY"; }
  else {
    isPlaying = true; currentBeat = 0; document.getElementById("playBtn").innerText = "STOP";
    const playNow = () => {
        const hits = notes.filter(n => n.beat === currentBeat);
        hits.forEach(h => playBassTone(h.note));
    };
    playNow();
    playbackInterval = setInterval(() => {
      currentBeat++; if (currentBeat > 20) currentBeat = 0;
      playNow();
    }, 500);
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  if (ghost) {
    ctx.save(); ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(ghost.x, ghost.y, 7, 5, -0.7, 0, 7);
    ctx.fillStyle = "#00d4ff"; ctx.fill(); ctx.restore();
  }
  drawNotes();
  requestAnimationFrame(loop);
}

document.getElementById('omr-upload').addEventListener('change', function(e) {
  const reader = new FileReader();
  reader.onload = (ev) => { omrImage = new Image(); omrImage.src = ev.target.result; };
  reader.readAsDataURL(e.target.files[0]);
});

canvas.addEventListener("pointerdown", (e) => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  isTouching = true;
  canvas.setPointerCapture(e.pointerId);
  
  const rect = canvas.getBoundingClientRect();
  const bIdx = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
  const pIdx = Math.round((e.clientY - rect.top - 75 - staffTop) / 7);
  const p = Math.max(0, Math.min(noteMap.length - 1, pIdx));
  
  // Maak een ghost die direct reageert
  ghost = { 
    x: startMargin + (bIdx * beatWidth), 
    y: staffTop + p * 7, 
    note: noteMap[p], 
    index: p, 
    beat: bIdx 
  };
  playBassTone(ghost.note);
});

canvas.addEventListener("pointermove", (e) => {
  if (!isTouching) return;
  
  const rect = canvas.getBoundingClientRect();
  const bIdx = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
  const pIdx = Math.round((e.clientY - rect.top - 75 - staffTop) / 7);
  const p = Math.max(0, Math.min(noteMap.length - 1, pIdx));
  
  let newGhost = { 
    x: startMargin + (bIdx * beatWidth), 
    y: staffTop + p * 7, 
    note: noteMap[p], 
    index: p, 
    beat: bIdx 
  };
  
  // Alleen geluid afspelen als we naar een andere noot schuiven
  if (ghost && (newGhost.note !== ghost.note || newGhost.beat !== ghost.beat)) {
    playBassTone(newGhost.note);
  }
  ghost = newGhost;
});

canvas.addEventListener("pointerup", () => {
  if (isTouching && ghost) {
    // Check of deze specifieke noot al op deze plek staat
    const existing = notes.findIndex(n => n.beat === ghost.beat && n.note === ghost.note);
    
    if (existing !== -1) {
      notes.splice(existing, 1); // Verwijderen bij tweede klik
    } else {
      notes.push(ghost); // Toevoegen
    }
    ghost = null;
  }
  isTouching = false;
});


function clearNotes() { notes = []; }
loop();
</script>
</body>
</html>
