<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>BassFlow Editor</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
    }

    canvas {
      background: #222;
      margin-top: 20px;
      touch-action: none;
    }
  </style>
</head>
<body>

<h3>BassFlow - Editor</h3>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = 240;

let notes = [];
let ghost = null;
let isTouching = false;

const staffTop = 80;
const spacing = 15;
const offset = 55; // 👈 hier stel je hoogte boven vinger in

// staff
function drawStaff() {
  ctx.strokeStyle = "white";
  for (let i = 0; i < 5; i++) {
    let y = staffTop + i * spacing;
    ctx.beginPath();
    ctx.moveTo(10, y);
    ctx.lineTo(canvas.width - 10, y);
    ctx.stroke();
  }
}

// schaal
const noteMap = [
  "g/5","f/5","e/5","d/5","c/5",
  "b/4","a/4","g/4","f/4","e/4",
  "d/4","c/4"
];

// mapping
function getNote(y) {
  const step = spacing / 2;

  let index = Math.round((y - staffTop) / step);
  index = Math.max(0, Math.min(noteMap.length - 1, index));

  return {
    y: staffTop + index * step,
    note: noteMap[index]
  };
}

// draw notes
function drawNotes() {
  notes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
  });
}

// ghost
function drawGhost() {
  if (!ghost) return;

  ctx.beginPath();
  ctx.arc(ghost.x, ghost.y, 6, 0, Math.PI * 2);
  ctx.fillStyle = "gray";
  ctx.fill();
}

// loop
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawNotes();
  drawGhost();
  requestAnimationFrame(loop);
}
loop();

// touch start
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  isTouching = true;
});

// touch move
canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (!isTouching) return;

  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];

  const x = touch.clientX - rect.left;

  // 👇 CRUCIAAL: we rekenen met offset
  const virtualY = touch.clientY - rect.top - offset;

  const snapped = getNote(virtualY);

  ghost = {
    x: x,
    y: snapped.y,   // 👈 GEEN extra offset meer!
    note: snapped.note
  };
});

// touch end
canvas.addEventListener("touchend", (e) => {
  e.preventDefault();

  if (ghost) {
    notes.push(ghost); // 👈 exact dezelfde positie
    ghost = null;
  }

  isTouching = false;
});

// klik fallback
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const snapped = getNote(y);

  notes.push({
    x: x,
    y: snapped.y,
    note: snapped.note
  });
});
</script>

</body>
</html>
