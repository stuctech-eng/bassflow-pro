<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>BassFlow Pro Editor</title>
  <style>
    body { margin: 0; background: #0d0d0d; color: white; font-family: sans-serif; text-align: center; overflow: hidden; overscroll-behavior-y: contain; }
    h3 { margin: 15px 0 5px; color: #00d4ff; text-transform: uppercase; letter-spacing: 2px; font-size: 18px; }
    canvas { background: #1a1a1a; display: block; margin: 0 auto; touch-action: none; border-bottom: 2px solid #333; }
    .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
    button { background: #222; color: #00d4ff; border: 1px solid #00d4ff; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:active { background: #00d4ff; color: black; }
  </style>
</head>
<body>

<h3>BassFlow Pro Editor</h3>
<canvas id="canvas"></canvas>

<div class="controls">
  <button onclick="clearNotes()">CLEAR</button>
  <button onclick="console.log(notes)">LOG DATA (MIDI-klaar)</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = 350;

let notes = []; 
let ghost = null;
let isTouching = false;

// --- CONFIGURATIE ---
const step = 14; 
const staffTop = 70;
const beatWidth = 50; // De afstand tussen de ritmische "slots"
const startMargin = 80; // Ruimte voor de F-sleutel

const noteMap = ["g/3","f/3","e/3","d/3","c/3","b/2","a/2","g/2","f/2","e/2","d/2","c/2","b/1","a/1","g/1","f/1","e/1"];
const staffLineIndexes = [5, 7, 9, 11, 13]; 

function drawBassClef(x, y) {
    ctx.strokeStyle = "white"; ctx.lineWidth = 3;
    const startY = staffTop + (7 * (step / 2));
    ctx.beginPath();
    ctx.arc(x + 10, startY + 5, 8, Math.PI * 1.1, Math.PI * 0.2);
    ctx.bezierCurveTo(x + 25, startY - 15, x + 25, startY + 30, x + 5, startY + 45);
    ctx.stroke();
    ctx.fillStyle = "white"; ctx.beginPath();
    ctx.arc(x + 30, startY - 5, 2.5, 0, Math.PI * 2);
    ctx.arc(x + 30, startY + 5, 2.5, 0, Math.PI * 2);
    ctx.fill();
}

function drawStaff() {
  ctx.strokeStyle = "#444"; // Subtiel grid
  ctx.lineWidth = 1;

  // Teken verticale grid lijnen (beats)
  for (let b = 0; b < 20; b++) {
    let x = startMargin + (b * beatWidth);
    ctx.beginPath();
    ctx.moveTo(x, staffTop);
    ctx.lineTo(x, staffTop + (16 * (step/2)));
    ctx.stroke();
  }

  // Teken de 5 horizontale lijnen
  ctx.strokeStyle = "#888";
  staffLineIndexes.forEach(index => {
    let y = staffTop + (index * (step / 2));
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  });
  
  drawBassClef(20, staffTop);
}

function getNoteData(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const rawX = clientX - rect.left;
  const rawY = clientY - rect.top - 75; // Vinger offset

  // SNAP NAAR BEAT (Horizontaal)
  let beatIndex = Math.round((rawX - startMargin) / beatWidth);
  beatIndex = Math.max(0, beatIndex);
  let snappedX = startMargin + (beatIndex * beatWidth);

  // SNAP NAAR TOONHOOGTE (Verticaal)
  let pitchIndex = Math.round((rawY - staffTop) / (step / 2));
  pitchIndex = Math.max(0, Math.min(noteMap.length - 1, pitchIndex));
  let snappedY = staffTop + pitchIndex * (step / 2);

  return { 
    x: snappedX, 
    y: snappedY, 
    note: noteMap[pitchIndex], 
    index: pitchIndex,
    beat: beatIndex // Dit is onze MIDI/Ritmische data!
  };
}

function drawLedgerLines(x, index) {
  ctx.strokeStyle = "white"; ctx.lineWidth = 1.5;
  const halfStep = step / 2;
  if (index < 5) {
    for (let i = 5 - 2; i >= index; i -= 2) {
      let ly = staffTop + (i * halfStep);
      ctx.beginPath(); ctx.moveTo(x - 15, ly); ctx.lineTo(x + 15, ly); ctx.stroke();
    }
  }
  if (index > 13) {
    for (let i = 13 + 2; i <= index; i += 2) {
      let ly = staffTop + (i * halfStep);
      ctx.beginPath(); ctx.moveTo(x - 15, ly); ctx.lineTo(x + 15, ly); ctx.stroke();
    }
  }
}

function drawNotes() {
  notes.forEach(n => {
    drawLedgerLines(n.x, n.index);
    ctx.beginPath();
    ctx.ellipse(n.x, n.y, 7, 5, Math.PI / -4, 0, Math.PI * 2);
    ctx.fillStyle = "white"; ctx.fill();
    ctx.beginPath(); ctx.lineWidth = 1.5; ctx.strokeStyle = "white";
    if (n.index <= 9) { 
        ctx.moveTo(n.x - 6, n.y); ctx.lineTo(n.x - 6, n.y + 35);
    } else {
        ctx.moveTo(n.x + 6, n.y); ctx.lineTo(n.x + 6, n.y - 35);
    }
    ctx.stroke();
  });
}

function drawGhost() {
  if (!ghost) return;
  ctx.save();
  ctx.globalAlpha = 0.6;
  drawLedgerLines(ghost.x, ghost.index);
  ctx.beginPath();
  ctx.ellipse(ghost.x, ghost.y, 7, 5, Math.PI / -4, 0, Math.PI * 2);
  ctx.fillStyle = "#00d4ff"; ctx.fill();
  ctx.restore();
}

function clearNotes() { notes = []; }

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawGhost();
  drawNotes();
  requestAnimationFrame(loop);
}
loop();

canvas.addEventListener("pointerdown", (e) => {
  isTouching = true;
  ghost = getNoteData(e.clientX, e.clientY);
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", (e) => {
  if (!isTouching) return;
  ghost = getNoteData(e.clientX, e.clientY);
});

canvas.addEventListener("pointerup", (e) => {
  if (isTouching && ghost) {
    // Voorkom dubbele noten op dezelfde beat
    notes = notes.filter(n => n.beat !== ghost.beat);
    notes.push(ghost);
    notes.sort((a, b) => a.beat - b.beat);
    ghost = null;
  }
  isTouching = false;
});

window.addEventListener("resize", () => { canvas.width = window.innerWidth; });
</script>
</body>
</html>
