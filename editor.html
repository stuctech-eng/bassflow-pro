<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>BassFlow Editor - Basgitaar</title>

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
      overscroll-behavior-y: contain;
    }

    h3 {
      margin: 15px 0 5px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    canvas {
      background: #1a1a1a;
      display: block;
      margin: 0 auto;
      touch-action: none;
      border-bottom: 2px solid #333;
    }

    .controls {
      margin-top: 15px;
    }

    button {
      background: #222;
      color: #00d4ff;
      border: 1px solid #00d4ff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
    }

    button:active {
      background: #00d4ff;
      color: black;
    }
  </style>
</head>
<body>

<h3>BassFlow Editor</h3>
<canvas id="canvas"></canvas>

<div class="controls">
  <button onclick="clearNotes()">CLEAR</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = 350;

let notes = [];
let ghost = null;
let isTouching = false;

// --- BASGITAAR CONFIGURATIE ---
const step = 14; 
const staffTop = 70;

// NoteMap voor Basgitaar (F-sleutel)
// Van G3 (hoog) tot E1 (laagste snaar bas)
const noteMap = [
  "g/3","f/3","e/3","d/3","c/3", // Boven de balk
  "b/2","a/2","g/2","f/2","e/2", // De 5 lijnen van de balk
  "d/2","c/2","b/1","a/1","g/1", // Onder de balk
  "f/1","e/1"                    // Hulplijnen onder
];

// De lijnen voor de Bass Clef (F-sleutel)
const staffLineIndexes = [5, 7, 9, 11, 13]; 

function drawStaff() {
  ctx.strokeStyle = "#555";
  ctx.lineWidth = 1;

  staffLineIndexes.forEach(index => {
    let y = staffTop + (index * (step / 2));
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  });
}

function getNoteData(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  
  // OFFSET FIX: 70px zorgt dat de noot ruim boven je vinger zweeft
  const visualOffset = 70; 
  const y = clientY - rect.top - visualOffset; 

  let index = Math.round((y - staffTop) / (step / 2));
  index = Math.max(0, Math.min(noteMap.length - 1, index));

  return {
    x: x,
    y: staffTop + index * (step / 2),
    note: noteMap[index],
    index: index
  };
}

function drawLedgerLines(x, index) {
  ctx.strokeStyle = "white";
  ctx.lineWidth = 1.5;
  const halfStep = step / 2;

  // Hulplijnen boven (index < 5)
  if (index < 5) {
    for (let i = 5 - 2; i >= index; i -= 2) {
      let ly = staffTop + (i * halfStep);
      ctx.beginPath(); ctx.moveTo(x - 15, ly); ctx.lineTo(x + 15, ly); ctx.stroke();
    }
  }

  // Hulplijnen onder (index > 13)
  if (index > 13) {
    for (let i = 13 + 2; i <= index; i += 2) {
      let ly = staffTop + (i * halfStep);
      ctx.beginPath(); ctx.moveTo(x - 15, ly); ctx.lineTo(x + 15, ly); ctx.stroke();
    }
  }
}

function drawNotes() {
  notes.forEach(n => {
    drawLedgerLines(n.x, n.index);
    
    // Nootkop
    ctx.beginPath();
    ctx.ellipse(n.x, n.y, 7, 5, Math.PI / -4, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    // Stokken logica: boven de middenlijn = stok omlaag, onder = stok omhoog
    ctx.beginPath();
    ctx.lineWidth = 1.5;
    if (n.index <= 9) { 
        ctx.moveTo(n.x - 6, n.y);
        ctx.lineTo(n.x - 6, n.y + 35);
    } else {
        ctx.moveTo(n.x + 6, n.y);
        ctx.lineTo(n.x + 6, n.y - 35);
    }
    ctx.stroke();
  });
}

function drawGhost() {
  if (!ghost) return;
  ctx.save();
  ctx.globalAlpha = 0.6;
  drawLedgerLines(ghost.x, ghost.index);
  
  ctx.beginPath();
  ctx.ellipse(ghost.x, ghost.y, 7, 5, Math.PI / -4, 0, Math.PI * 2);
  ctx.fillStyle = "#00d4ff";
  ctx.fill();
  ctx.restore();
}

function clearNotes() {
  notes = [];
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawGhost();
  drawNotes();
  requestAnimationFrame(loop);
}
loop();

// Event Listeners
canvas.addEventListener("pointerdown", (e) => {
  isTouching = true;
  ghost = getNoteData(e.clientX, e.clientY);
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", (e) => {
  if (!isTouching) return;
  ghost = getNoteData(e.clientX, e.clientY);
});

canvas.addEventListener("pointerup", (e) => {
  if (isTouching && ghost) {
    notes.push(ghost);
    ghost = null;
  }
  isTouching = false;
});

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
});
</script>

</body>
</html>
