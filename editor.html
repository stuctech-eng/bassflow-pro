<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>BassFlow Pro - Editor</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0d0d; color: white; font-family: sans-serif; overflow: hidden; overscroll-behavior: contain; user-select: none; }

    #toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #111; border-bottom: 1px solid #222; overflow-x: auto; white-space: nowrap; }
    #toolbar::-webkit-scrollbar { display: none; }

    .tool-group { display: flex; gap: 4px; align-items: center; padding-right: 8px; border-right: 1px solid #333; margin-right: 2px; }
    .tool-group:last-child { border-right: none; }

    .tb { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tb.active { background: #FF2D7A; color: #fff; border-color: #FF2D7A; }
    .tb.play { background: #FF2D7A; color: #fff; border-color: #FF2D7A; min-width: 60px; }
    .tb.play.playing { background: #333; color: #FF2D7A; border-color: #FF2D7A; }
    .tb.danger { color: #E53935; border-color: #E53935; }
    .tb.midi { color: #ffaa00; border-color: #ffaa00; }
    .tb.ai { color: #8B2FC9; border-color: #8B2FC9; background: #1a1a1a; }
    .tb.ai.active { background: #8B2FC9; color: #fff; }

    label.tb { display: inline-flex; align-items: center; }
    input[type="file"] { display: none; }

    #bpm-wrap { display: flex; align-items: center; gap: 6px; }
    #bpm-label { font-size: 10px; color: #FF2D7A; font-weight: 800; min-width: 52px; }
    #bpm-slider { width: 70px; accent-color: #FF2D7A; }

    #maat-select { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }

    #canvas-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
    canvas { background: #151515; display: block; touch-action: pan-x; }

    #statusbar { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #222; padding: 6px 12px; font-size: 10px; color: #555; display: flex; justify-content: space-between; align-items: center; }
    #status-msg { color: #FF2D7A; font-weight: 700; font-size: 11px; }
  </style>
</head>
<body>

<div id="toolbar">
  <div class="tool-group">
    <button class="tb play" id="playBtn" onclick="togglePlayback()">▶ PLAY</button>
  </div>

  <div class="tool-group">
    <button class="tb active" id="tool-noot" onclick="setTool('noot')">✏️ Noot</button>
    <button class="tb" id="tool-rust" onclick="setTool('rust')">-- Rust</button>
    <button class="tb danger" id="tool-wis" onclick="setTool('wis')">✕ Wis</button>
  </div>

  <div class="tool-group">
    <button class="tb active" id="dur-4" onclick="setDuur(4,'♩')">♩</button>
    <button class="tb" id="dur-2" onclick="setDuur(2,'♩')">𝅗𝅥</button>
    <button class="tb" id="dur-1" onclick="setDuur(1,'𝅝')">𝅝</button>
    <button class="tb" id="dur-8" onclick="setDuur(8,'♪')">♪</button>
    <button class="tb" id="dur-16" onclick="setDuur(16,'𝅘𝅥𝅯')">𝅘𝅥𝅯</button>
  </div>

  <div class="tool-group">
    <select id="maat-select" onchange="setMaat(this.value)">
      <option value="4">4/4</option>
      <option value="3">3/4</option>
      <option value="6">6/8</option>
    </select>
  </div>

  <div class="tool-group" id="bpm-wrap">
    <span id="bpm-label">120 BPM</span>
    <input type="range" id="bpm-slider" min="40" max="240" value="120" oninput="setBpm(this.value)">
  </div>

  <div class="tool-group">
    <label class="tb ai" for="ai-upload">🤖 AI</label>
    <input type="file" id="ai-upload" accept="image/*" onchange="handleAIUpload(this)">
    <button class="tb midi" onclick="exportMIDI()">⬇ MIDI</button>
    <button class="tb danger" onclick="clearNotes()">CLEAR</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div id="statusbar">
  <span id="status-msg"></span>
  <span id="status-info">BassFlow Pro Editor</span>
</div>

<script>
const PINK = "#FF2D7A";
const CYAN = "#00d4ff";
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

let isPlaying = false, currentTick = 0, playbackTimer = null;
let activeTool = "noot";
let activeDuur = 4;
let bpm = 120;
let maatTeller = 4;
let notes = [];
let ghost = null;
let isTouching = false;
let aiBezig = false;

const TICKS_PER_KWART = 4;
const TICK_WIDTH = 14;
const MATEN = 8;
const startMargin = 60;
const staffTop = 50;
const staffLines = [0, 2, 4, 6, 8];
const STAFF_STEP = 7;
const tabTop = 220;
const TAB_STRINGS = 4;
const TAB_GAP = 18;
const canvasH = 380;

const noteMap = [
  "g/3","f/3","e/3","d/3","c/3",
  "b/2","a/2","g/2","f/2","e/2",
  "d/2","c/2","b/1","a/1","g/1","f/1","e/1"
];

const noteLabels = {
  "g/3":"G","f/3":"F","e/3":"E","d/3":"D","c/3":"C",
  "b/2":"B","a/2":"A","g/2":"G","f/2":"F","e/2":"E",
  "d/2":"D","c/2":"C","b/1":"B","a/1":"A","g/1":"G","f/1":"F","e/1":"E"
};

const frequencies = {
  "g/3":196.00,"f/3":174.61,"e/3":164.81,"d/3":146.83,"c/3":130.81,
  "b/2":123.47,"a/2":110.00,"g/2":98.00,"f/2":87.31,"e/2":82.41,
  "d/2":73.42,"c/2":65.41,"b/1":61.74,"a/1":55.00,"g/1":49.00,"f/1":43.65,"e/1":41.20
};

const midiPitches = {
  "g/3":55,"f/3":53,"e/3":52,"d/3":50,"c/3":48,"b/2":47,"a/2":45,"g/2":43,
  "f/2":41,"e/2":40,"d/2":38,"c/2":36,"b/1":35,"a/1":33,"g/1":31,"f/1":29,"e/1":28
};

const tabMap = {
  "g/3":{s:1,f:12},"f/3":{s:1,f:10},"e/3":{s:1,f:9},"d/3":{s:1,f:7},"c/3":{s:1,f:5},
  "b/2":{s:1,f:4},"a/2":{s:1,f:2},"g/2":{s:1,f:0},"f/2":{s:2,f:3},"e/2":{s:2,f:2},
  "d/2":{s:2,f:0},"c/2":{s:3,f:3},"b/1":{s:3,f:2},"a/1":{s:3,f:0},"g/1":{s:4,f:3},
  "f/1":{s:4,f:1},"e/1":{s:4,f:0}
};

function duurInTicks(d) {
  if (d === 1) return TICKS_PER_KWART * 4;
  if (d === 2) return TICKS_PER_KWART * 2;
  if (d === 4) return TICKS_PER_KWART;
  if (d === 8) return TICKS_PER_KWART / 2;
  if (d === 16) return TICKS_PER_KWART / 4;
  return TICKS_PER_KWART;
}

function totaleTicks() { return MATEN * maatTeller * TICKS_PER_KWART; }

function tickNaarX(tick) { return startMargin + tick * TICK_WIDTH; }

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function herbereken() {
  canvas.width = Math.max(window.innerWidth, startMargin + totaleTicks() * TICK_WIDTH + 40);
  canvas.height = canvasH;
}
herbereken();

function setTool(t) {
  activeTool = t;
  ["noot","rust","wis"].forEach(function(x) {
    document.getElementById("tool-" + x).classList.toggle("active", x === t);
  });
}

function setDuur(d) {
  activeDuur = d;
  [1,2,4,8,16].forEach(function(x) {
    document.getElementById("dur-" + x).classList.toggle("active", x === d);
  });
}

function setBpm(v) {
  bpm = parseInt(v);
  document.getElementById("bpm-label").textContent = bpm + " BPM";
}

function setMaat(v) {
  maatTeller = parseInt(v);
  herbereken();
}

function setStatus(msg) {
  document.getElementById("status-msg").textContent = msg;
  if (msg) setTimeout(function() { document.getElementById("status-msg").textContent = ""; }, 3000);
}

function noteYIndex(noteStr) { return noteMap.indexOf(noteStr); }

function yNaarNoteIndex(y) {
  const idx = Math.round((y - staffTop - staffLines[0] * STAFF_STEP) / STAFF_STEP);
  return Math.max(0, Math.min(noteMap.length - 1, idx));
}

function drawStaff() {
  const W = canvas.width;
  ctx.lineWidth = 1;

  // Maat lijnen
  for (let m = 0; m <= MATEN; m++) {
    const x = tickNaarX(m * maatTeller * TICKS_PER_KWART);
    ctx.strokeStyle = m % 4 === 0 ? "#555" : "#2a2a2a";
    ctx.lineWidth = m % 4 === 0 ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(x, staffTop - 20); ctx.lineTo(x, tabTop + TAB_STRINGS * TAB_GAP + 10); ctx.stroke();

    // Maatnummer
    if (m < MATEN) {
      ctx.fillStyle = "#444"; ctx.font = "10px Arial"; ctx.textAlign = "left";
      ctx.fillText((m + 1), x + 3, staffTop - 8);
    }
  }

  // Beat lijnen (licht)
  for (let b = 0; b < totaleTicks(); b++) {
    if (b % TICKS_PER_KWART === 0 && b % (maatTeller * TICKS_PER_KWART) !== 0) {
      const x = tickNaarX(b);
      ctx.strokeStyle = "#1e1e1e"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, staffTop); ctx.lineTo(x, staffTop + 8 * STAFF_STEP + 10); ctx.stroke();
    }
  }

  // Notenbalk (5 lijnen)
  ctx.strokeStyle = "#666"; ctx.lineWidth = 1;
  staffLines.forEach(function(i) {
    const y = staffTop + (i + 2) * STAFF_STEP;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  });

  // Basleutel
  ctx.fillStyle = PINK; ctx.font = "bold 36px serif"; ctx.textAlign = "left";
  ctx.fillText("?", 8, staffTop + 7 * STAFF_STEP);

  // Noot labels links
  ctx.font = "9px Arial"; ctx.fillStyle = "#333";
  noteMap.forEach(function(n, i) {
    const y = staffTop + i * STAFF_STEP;
    ctx.textAlign = "right";
    ctx.fillText(noteLabels[n], startMargin - 4, y + 4);
  });

  // Tablature lijnen
  ctx.strokeStyle = "#444"; ctx.lineWidth = 1;
  for (let s = 0; s < TAB_STRINGS; s++) {
    const y = tabTop + s * TAB_GAP;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // TAB label
  ctx.fillStyle = "#555"; ctx.font = "bold 11px Arial"; ctx.textAlign = "left";
  ctx.fillText("T", 6, tabTop + 2);
  ctx.fillText("A", 6, tabTop + TAB_GAP + 2);
  ctx.fillText("B", 6, tabTop + TAB_GAP * 2 + 2);

  // Playhead
  if (isPlaying) {
    const x = tickNaarX(currentTick);
    ctx.strokeStyle = PINK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, staffTop - 20); ctx.lineTo(x, tabTop + TAB_STRINGS * TAB_GAP + 10); ctx.stroke();
  }
}

function drawNootVorm(cx, cy, nootIndex, duur, kleur, alpha) {
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  const gevuld = duur >= 4;
  const isHoog = nootIndex <= 8;
  const stielX = isHoog ? cx + 6 : cx - 6;
  const stielY = isHoog ? cy - 28 : cy + 28;

  // Noot hoofd
  ctx.beginPath();
  ctx.ellipse(cx, cy, 7, 5, -0.3, 0, Math.PI * 2);
  if (gevuld) { ctx.fillStyle = kleur; ctx.fill(); }
  else { ctx.strokeStyle = kleur; ctx.lineWidth = 1.5; ctx.stroke(); }

  // Stiel
  ctx.strokeStyle = kleur; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(stielX, cy); ctx.lineTo(stielX, stielY); ctx.stroke();

  // Vlaggen voor achtsten/zestienden
  if (duur === 8 || duur === 16) {
    ctx.beginPath();
    if (isHoog) {
      ctx.moveTo(stielX, stielY);
      ctx.bezierCurveTo(stielX + 16, stielY + 8, stielX + 12, stielY + 16, stielX, stielY + 20);
    } else {
      ctx.moveTo(stielX, stielY);
      ctx.bezierCurveTo(stielX - 16, stielY - 8, stielX - 12, stielY - 16, stielX, stielY - 20);
    }
    ctx.strokeStyle = kleur; ctx.lineWidth = 1.5; ctx.stroke();
  }
  if (duur === 16) {
    ctx.beginPath();
    if (isHoog) {
      ctx.moveTo(stielX, stielY + 10);
      ctx.bezierCurveTo(stielX + 16, stielY + 18, stielX + 12, stielY + 26, stielX, stielY + 30);
    } else {
      ctx.moveTo(stielX, stielY - 10);
      ctx.bezierCurveTo(stielX - 16, stielY - 18, stielX - 12, stielY - 26, stielX, stielY - 30);
    }
    ctx.strokeStyle = kleur; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // Hulplijnen
  const staffY = staffTop + 2 * STAFF_STEP;
  const staffBottom = staffTop + 6 * STAFF_STEP;
  if (cy < staffY - 2) {
    for (let ly = staffY - STAFF_STEP; ly >= cy - STAFF_STEP; ly -= STAFF_STEP) {
      ctx.strokeStyle = kleur; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - 10, ly); ctx.lineTo(cx + 10, ly); ctx.stroke();
    }
  }
  if (cy > staffBottom + 2) {
    for (let ly = staffBottom + STAFF_STEP; ly <= cy + STAFF_STEP; ly += STAFF_STEP) {
      ctx.strokeStyle = kleur; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - 10, ly); ctx.lineTo(cx + 10, ly); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawRust(cx, cy, duur, kleur, alpha) {
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.fillStyle = kleur; ctx.strokeStyle = kleur; ctx.lineWidth = 2;
  const y = staffTop + 4 * STAFF_STEP;
  if (duur === 1) {
    ctx.fillRect(cx - 10, y - 6, 20, 8);
  } else if (duur === 2) {
    ctx.fillRect(cx - 10, y, 20, 8);
  } else if (duur === 4) {
    ctx.font = "bold 24px serif"; ctx.textAlign = "center"; ctx.fillText("𝄽", cx, y + 12);
  } else if (duur === 8) {
    ctx.font = "bold 18px serif"; ctx.textAlign = "center"; ctx.fillText("𝄾", cx, y + 10);
  } else if (duur === 16) {
    ctx.font = "bold 18px serif"; ctx.textAlign = "center"; ctx.fillText("𝄿", cx, y + 10);
  }
  ctx.restore();
}

function drawNotes() {
  notes.forEach(function(n) {
    const x = tickNaarX(n.tick);
    if (n.isRust) {
      drawRust(x, 0, n.duur, "white");
    } else {
      const ni = noteYIndex(n.note);
      const y = staffTop + ni * STAFF_STEP;
      drawNootVorm(x, y, ni, n.duur, "white");

      const t = tabMap[n.note];
      if (t) {
        const ty = tabTop + (t.s - 1) * TAB_GAP;
        ctx.fillStyle = "#151515"; ctx.fillRect(x - 9, ty - 8, 18, 16);
        ctx.fillStyle = CYAN; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
        ctx.fillText(t.f, x, ty + 5);
      }
    }
  });
}

function drawGhost() {
  if (!ghost) return;
  const x = tickNaarX(ghost.tick);
  if (ghost.isRust) {
    drawRust(x, 0, activeDuur, PINK, 0.5);
  } else {
    const ni = noteYIndex(ghost.note);
    const y = staffTop + ni * STAFF_STEP;
    drawNootVorm(x, y, ni, activeDuur, PINK, 0.5);
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawGhost();
  drawNotes();
  requestAnimationFrame(loop);
}

function posNaarTick(clientX) {
  const wrap = document.getElementById("canvas-wrap");
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left + wrap.scrollLeft;
  const tick = Math.round((x - startMargin) / TICK_WIDTH);
  const snapTick = duurInTicks(activeDuur);
  return Math.max(0, Math.round(tick / snapTick) * snapTick);
}

function posNaarNote(clientY) {
  const rect = canvas.getBoundingClientRect();
  const y = clientY - rect.top;
  return yNaarNoteIndex(y);
}

canvas.addEventListener("pointerdown", function(e) {
  if (audioCtx.state === "suspended") audioCtx.resume();
  isTouching = true;
  canvas.setPointerCapture(e.pointerId);
  const tick = posNaarTick(e.clientX);
  const ni = posNaarNote(e.clientY);

  if (activeTool === "wis") {
    notes = notes.filter(function(n) { return !(Math.abs(n.tick - tick) < duurInTicks(activeDuur)); });
    return;
  }
  if (activeTool === "rust") {
    ghost = { tick: tick, isRust: true, duur: activeDuur };
    return;
  }
  ghost = { tick: tick, note: noteMap[ni], isRust: false, duur: activeDuur };
  playBassTone(noteMap[ni]);
});

canvas.addEventListener("pointermove", function(e) {
  if (!isTouching) return;
  const tick = posNaarTick(e.clientX);
  const ni = posNaarNote(e.clientY);
  if (activeTool === "noot") {
    const newNote = noteMap[ni];
    if (!ghost || ghost.note !== newNote || ghost.tick !== tick) {
      if (newNote !== (ghost && ghost.note)) playBassTone(newNote);
      ghost = { tick: tick, note: newNote, isRust: false, duur: activeDuur };
    }
  } else if (activeTool === "rust") {
    ghost = { tick: tick, isRust: true, duur: activeDuur };
  }
});

canvas.addEventListener("pointerup", function() {
  if (isTouching && ghost && activeTool !== "wis") {
    const bestaand = notes.findIndex(function(n) {
      return n.tick === ghost.tick && (n.isRust ? ghost.isRust : n.note === ghost.note);
    });
    if (bestaand !== -1) {
      notes.splice(bestaand, 1);
    } else {
      notes.push(Object.assign({}, ghost));
    }
  }
  ghost = null;
  isTouching = false;
});

function playBassTone(noteName) {
  if (!frequencies[noteName]) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(frequencies[noteName], audioCtx.currentTime);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.6);
}

function togglePlayback() {
  if (audioCtx.state === "suspended") audioCtx.resume();
  const btn = document.getElementById("playBtn");
  if (isPlaying) {
    clearInterval(playbackTimer);
    isPlaying = false; currentTick = 0;
    btn.textContent = "▶ PLAY"; btn.classList.remove("playing");
  } else {
    isPlaying = true; currentTick = 0;
    btn.textContent = "⏹ STOP"; btn.classList.add("playing");
    const msPerTick = (60 / bpm / TICKS_PER_KWART) * 1000;
    playbackTimer = setInterval(function() {
      const hits = notes.filter(function(n) { return !n.isRust && n.tick === currentTick; });
      hits.forEach(function(h) { playBassTone(h.note); });
      currentTick++;
      if (currentTick >= totaleTicks()) {
        currentTick = 0;
      }
    }, msPerTick);
  }
}

function clearNotes() {
  if (confirm("Alle noten wissen?")) { notes = []; }
}

async function handleAIUpload(input) {
  const bestand = input.files[0];
  if (!bestand || aiBezig) return;
  aiBezig = true;
  setStatus("🤖 AI analyseert foto...");

  const reader = new FileReader();
  reader.onload = async function(ev) {
    const base64 = ev.target.result.split(",")[1];
    try {
      const response = await fetch("https://analyseertablature-dia7q5dlaq-uc.a.run.app", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ base64Foto: base64, modus: "noten" })
      });
      const data = await response.json();
      if (data.noten && data.noten.length > 0) {
        data.noten.forEach(function(n) {
          if (noteMap.includes(n.note)) {
            notes.push({ tick: n.tick * TICKS_PER_KWART, note: n.note, duur: n.duur || 4, isRust: false });
          }
        });
        setStatus("✓ " + data.noten.length + " noten geïmporteerd!");
      } else {
        setStatus("Geen noten herkend. Probeer een duidelijkere foto.");
      }
    } catch(err) {
      setStatus("Fout bij AI analyse.");
    }
    aiBezig = false;
    input.value = "";
  };
  reader.readAsDataURL(bestand);
}

function exportMIDI() {
  if (notes.length === 0) { setStatus("Zet eerst wat noten neer!"); return; }
  const header = [0x4d,0x54,0x68,0x64,0x00,0x00,0x00,0x06,0x00,0x00,0x00,0x01,0x00,0x60];
  let events = [];
  const sorted = [...notes].filter(function(n) { return !n.isRust; }).sort(function(a,b) { return a.tick - b.tick; });
  let lastTick = 0;
  sorted.forEach(function(n) {
    const tick = n.tick * 8;
    const delta = tick - lastTick;
    const pitch = midiPitches[n.note];
    const duurTicks = duurInTicks(n.duur) * 8;
    events.push(delta > 127 ? [0x81, delta & 0x7f] : [delta], [0x90, pitch, 0x64]);
    events.push([duurTicks > 127 ? 0x81 : duurTicks], [0x80, pitch, 0x00]);
    lastTick = tick + duurTicks;
  });
  events.push([0x01, 0xff, 0x2f, 0x00]);
  const flat = [].concat(...events);
  const trackData = [0x4d,0x54,0x72,0x6b];
  const len = flat.length;
  const size = [(len>>24)&0xff,(len>>16)&0xff,(len>>8)&0xff,len&0xff];
  const fullFile = new Uint8Array([...header,...trackData,...size,...flat]);
  const blob = new Blob([fullFile], {type:"audio/midi"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "bassline.mid";
  link.click();
  setStatus("MIDI geëxporteerd!");
}

loop();
</script>
</body>
