<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>BassFlow - Stable</title>
  <style>
    :root { --accent: #00d4ff; --bg: #0d0d0d; }
    body { 
      margin: 0; background: var(--bg); color: white; font-family: sans-serif; 
      overflow: hidden; touch-action: none; -webkit-user-select: none;
    }
    canvas { display: block; background: #111; touch-action: none; }
    
    .bottom-bar { 
      position: fixed; bottom: 0; width: 100%; height: 100px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: #1a1a1a; border-top: 1px solid #333; gap: 10px; padding-bottom: 10px;
    }
    .controls-row { display: flex; gap: 20px; }
    .btn { background: #222; border: 1px solid var(--accent); color: var(--accent); padding: 10px 25px; border-radius: 12px; font-weight: bold; }
    .bpm-container { display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 14px; font-weight: bold; }
    input[type=range] { width: 150px; accent-color: var(--accent); }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="bottom-bar">
  <div class="bpm-container">
    <span>TEMPO:</span>
    <input type="range" id="bpmSlider" min="60" max="180" value="120" oninput="updateBPM(this.value)">
    <span id="bpmVal">120</span>
  </div>
  <div class="controls-row">
    <button class="btn" onclick="clearNotes()">CLEAR</button>
    <button id="playBtn" class="btn" onclick="togglePlayback()">PLAY</button>
  </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight - 100;

let notes = [], ghost = null, isTouching = false;
let isPlaying = false, currentBeat = 0, nextNoteTime = 0, bpm = 120;

const staffTop = 80, tabTop = 300, beatWidth = 50, startMargin = 60;
const noteMap = ["g/3","f/3","e/3","d/3","c/3","b/2","a/2","g/2","f/2","e/2","d/2","c/2","b/1","a/1","g/1","f/1","e/1"];
const frequencies = {"g/3":196.0,"f/3":174.61,"e/3":164.81,"d/3":146.83,"c/3":130.81,"b/2":123.47,"a/2":110.0,"g/2":98.0,"f/2":87.31,"e/2":82.41,"d/2":73.42,"c/2":65.41,"b/1":61.74,"a/1":55.0,"g/1":49.0,"f/1":43.65,"e/1":41.2};

function updateBPM(val) { bpm = val; document.getElementById('bpmVal').innerText = val; }

function playNote(freq, time) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0.4, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(time); osc.stop(time + 0.3);
}

function draw() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    
    // Grid & Balken
    for(let b=0; b<32; b++) {
        let x = startMargin + (b * beatWidth);
        ctx.strokeStyle = (b % 4 === 0) ? "#666" : "#222";
        ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, 450); ctx.stroke();
    }
    ctx.strokeStyle = "#444";
    [5,7,9,11,13].forEach(i => { let y = staffTop + (i*7); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); });

    // Noten tekenen
    notes.forEach(n => {
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.ellipse(n.x, n.y, 7, 5, -0.7, 0, 7); ctx.fill();
        // Stokje
        ctx.strokeStyle = "white"; ctx.lineWidth = 1.5;
        let dir = n.index <= 9 ? 1 : -1;
        ctx.beginPath(); ctx.moveTo(n.x+(6*-dir), n.y); ctx.lineTo(n.x+(6*-dir), n.y+(30*dir)); ctx.stroke();
    });

    if(ghost) {
        ctx.fillStyle = "rgba(0, 212, 255, 0.4)";
        ctx.beginPath(); ctx.ellipse(ghost.x, ghost.y, 7, 5, -0.7, 0, 7); ctx.fill();
    }
    
    if(isPlaying) {
        ctx.strokeStyle = "#00d4ff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(startMargin + (currentBeat * beatWidth), 20); ctx.lineTo(startMargin + (currentBeat * beatWidth), 450); ctx.stroke();
    }
    requestAnimationFrame(draw);
}

// De simpele interactie: Tikken = noot, nog een keer tikken op dezelfde plek = weg
canvas.addEventListener("pointerdown", (e) => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const rect = canvas.getBoundingClientRect();
    const b = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
    const p = Math.max(0, Math.min(noteMap.length - 1, Math.round((e.clientY - rect.top - staffTop) / 7)));
    
    const idx = notes.findIndex(n => n.beat === b && n.index === p);
    if(idx !== -1) {
        notes.splice(idx, 1);
    } else {
        const newNote = { x: startMargin + (b * beatWidth), y: staffTop + p * 7, beat: b, index: p, note: noteMap[p] };
        notes.push(newNote);
        playNote(frequencies[newNote.note], audioCtx.currentTime);
    }
});

function togglePlayback() {
    if(isPlaying) { isPlaying = false; document.getElementById("playBtn").innerText="PLAY"; }
    else {
        isPlaying = true; currentBeat = 0; nextNoteTime = audioCtx.currentTime;
        document.getElementById("playBtn").innerText="STOP";
        scheduler();
    }
}

function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + 0.1 && isPlaying) {
        notes.filter(n => n.beat === currentBeat).forEach(n => playNote(frequencies[n.note], nextNoteTime));
        nextNoteTime += (60 / bpm);
        currentBeat++; if(currentBeat > 31) currentBeat = 0;
    }
    if(isPlaying) setTimeout(scheduler, 25);
}

function clearNotes() { notes = []; }

draw();
</script>
</body>
</html>
