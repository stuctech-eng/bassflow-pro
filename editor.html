<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>BassFlow Editor</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
    }

    canvas {
      background: #222;
      margin-top: 20px;
      touch-action: none;
    }
  </style>
</head>
<body>

<h3>BassFlow - Editor</h3>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = 320;

let notes = [];
let ghost = null;
let isTouching = false;

// 🔥 GROTER BEREIK
const noteMap = [
  "b/5","a/5","g/5","f/5","e/5","d/5","c/5",
  "b/4","a/4","g/4","f/4","e/4","d/4","c/4",
  "b/3","a/3","g/3","f/3","e/3"
];

// 🔥 AUTOMATISCHE SCHAAL
const step = 12; // afstand per stap
const staffTop = 60;

// staff tekenen (visueel midden)
function drawStaff() {
  ctx.strokeStyle = "white";

  // 5 lijnen rond midden van schaal
  const midIndex = Math.floor(noteMap.length / 2);

  for (let i = -2; i <= 2; i++) {
    let y = staffTop + (midIndex + i * 2) * step / 2;
    ctx.beginPath();
    ctx.moveTo(10, y);
    ctx.lineTo(canvas.width - 10, y);
    ctx.stroke();
  }
}

// mapping (nu exact gelijk aan visueel)
function getNote(y) {
  let index = Math.round((y - staffTop) / (step / 2));
  index = Math.max(0, Math.min(noteMap.length - 1, index));

  return {
    y: staffTop + index * (step / 2),
    note: noteMap[index]
  };
}

// notes
function drawNotes() {
  notes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
  });
}

// ghost
function drawGhost() {
  if (!ghost) return;

  ctx.beginPath();
  ctx.arc(ghost.x, ghost.y, 6, 0, Math.PI * 2);
  ctx.fillStyle = "gray";
  ctx.fill();
}

// loop
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawNotes();
  drawGhost();
  requestAnimationFrame(loop);
}
loop();

const offset = 60;

// touch
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  isTouching = true;
});

canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (!isTouching) return;

  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];

  const x = touch.clientX - rect.left;
  const virtualY = touch.clientY - rect.top - offset;

  const snapped = getNote(virtualY);

  ghost = {
    x: x,
    y: snapped.y,
    note: snapped.note
  };
});

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();

  if (ghost) {
    notes.push(ghost);
    ghost = null;
  }

  isTouching = false;
});

// click fallback
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const snapped = getNote(y);

  notes.push({
    x: x,
    y: snapped.y,
    note: snapped.note
  });
});
</script>

</body>
</html>
