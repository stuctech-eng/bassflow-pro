<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="color-scheme" content="light only">
  <title>BassFlow VexFlow Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; }
    #output { width: 100%; overflow-x: auto; }
  </style>
</head>
<body>
  <div id="output"></div>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.0.3/build/cjs/vexflow.js"></script>
  <script>
    const { Renderer, Stave } = Vex.Flow;
    const div = document.getElementById("output");
    const renderer = new Renderer(div, Renderer.Backends.SVG);
    renderer.resize(window.innerWidth, 200);
    const context = renderer.getContext();
    const stave = new Stave(10, 40, window.innerWidth - 20);
    stave.addClef("bass").addTimeSignature("4/4");
    stave.setContext(context).draw();
  </script>
</body>
</html>
