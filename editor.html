<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="color-scheme" content="light only">
  <title>BassFlow Pro - Editor</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #fff !important; color: #111; font-family: sans-serif; overflow: hidden; overscroll-behavior: contain; user-select: none; -webkit-user-select: none; display: flex; flex-direction: column; height: 100vh; }
    #canvas-area { flex: 1; overflow: hidden; background: #fff !important; }
    canvas { background: #fff !important; display: block; touch-action: none; }
    #bottombar { background: #fff !important; border-top: 1.5px solid #eee; padding: 8px 10px 10px 10px; flex-shrink: 0; }
    #row1 { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
    #row2 { display: flex; align-items: center; gap: 6px; }
    .tb { background: #f5f5f7 !important; color: #444 !important; border: 1px solid #e0e0e0 !important; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; -webkit-appearance: none; }
    .tb.active { background: #FF2D7A !important; color: #fff !important; border-color: #FF2D7A !important; }
    .tb.play { background: #FF2D7A !important; color: #fff !important; border-color: #FF2D7A !important; min-width: 72px; font-size: 13px; }
    .tb.play.playing { background: #fff0f5 !important; color: #FF2D7A !important; border-color: #FF2D7A !important; }
    .tb.danger { background: #f5f5f7 !important; color: #E53935 !important; border-color: #e0e0e0 !important; }
    .tb.midi { background: #f5f5f7 !important; color: #cc8800 !important; border-color: #e0e0e0 !important; }
    .tb.ai { background: #f5f5f7 !important; color: #8B2FC9 !important; border-color: #e0e0e0 !important; }
    .tb.bg { background: #f5f5f7 !important; color: #0088cc !important; border-color: #e0e0e0 !important; }
    .sep { width: 1px; height: 28px; background: #e8e8e8; flex-shrink: 0; margin: 0 2px; }
    label.tb { display: inline-flex; align-items: center; justify-content: center; }
    input[type="file"] { display: none; }
    #bpm-wrap { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
    #bpm-label { font-size: 10px; color: #FF2D7A !important; font-weight: 800; min-width: 52px; white-space: nowrap; }
    #bpm-slider { flex: 1; accent-color: #FF2D7A; min-width: 50px; }
    #maat-select { background: #f5f5f7 !important; color: #444 !important; border: 1px solid #e0e0e0 !important; padding: 7px 6px; border-radius: 8px; font-size: 11px; font-weight: 700; -webkit-appearance: none; }
    #bg-controls { display: none; position: fixed; bottom: 115px; left: 10px; right: 10px; background: #fff !important; border: 1px solid #eee; border-radius: 10px; padding: 8px 12px; z-index: 50; align-items: center; gap: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    #bg-controls.open { display: flex; }
    #opacity-slider { flex: 1; accent-color: #FF2D7A; }
    #popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
    #popup.open { display: flex; }
    #popup-inner { background: #fff !important; border-radius: 16px; padding: 20px; width: 100%; max-width: 320px; }
    #popup-title { font-size: 13px; font-weight: 800; color: #FF2D7A; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    #popup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .popup-item { background: #f5f5f7 !important; border: 1.5px solid #e0e0e0; border-radius: 10px; padding: 12px 6px; text-align: center; cursor: pointer; }
    .popup-item.active-item { border-color: #FF2D7A !important; background: #fff0f5 !important; }
    .popup-item .pi-symbool { font-size: 24px; color: #111 !important; line-height: 1.3; }
    .popup-item .pi-naam { font-size: 10px; color: #666 !important; margin-top: 3px; font-weight: 700; }
    .popup-item .pi-tellen { font-size: 9px; color: #aaa !important; margin-top: 2px; }
    #popup-sluit { margin-top: 12px; width: 100%; background: #f5f5f7 !important; color: #666 !important; border: none; border-radius: 10px; padding: 11px; font-size: 13px; font-weight: 800; cursor: pointer; }
    #status-msg { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #FF2D7A !important; color: #fff !important; padding: 7px 18px; border-radius: 20px; font-size: 12px; font-weight: 700; display: none; z-index: 300; white-space: nowrap; }
    #status-msg.show { display: block; }
  </style>
</head>
<body>

<div id="canvas-area">
  <canvas id="canvas"></canvas>
</div>

<div id="bottombar">
  <div id="row1">
    <button class="tb play" id="playBtn" onclick="togglePlayback()">▶ PLAY</button>
    <div class="sep"></div>
    <button class="tb active" id="tool-noot" onclick="openPopup('noot')">♩ Noot</button>
    <button class="tb" id="tool-rust" onclick="openPopup('rust')">𝄽 Rust</button>
    <button class="tb danger" id="tool-wis" onclick="setTool('wis')">✕ Wis</button>
    <div class="sep"></div>
    <select id="maat-select" onchange="setMaat(this.value)">
      <option value="4">4/4</option>
      <option value="3">3/4</option>
      <option value="6">6/8</option>
    </select>
    <div class="sep"></div>
    <div id="bpm-wrap">
      <span id="bpm-label">120 BPM</span>
      <input type="range" id="bpm-slider" min="40" max="240" value="120" oninput="setBpm(this.value)">
    </div>
  </div>
  <div id="row2">
    <button class="tb" onclick="zoomIn()">＋</button>
    <button class="tb" onclick="zoomOut()">－</button>
    <div class="sep"></div>
    <label class="tb bg" for="bg-upload">📷 BG</label>
    <input type="file" id="bg-upload" accept="image/*" onchange="handleBGUpload(this)">
    <label class="tb ai" for="ai-upload">🤖 AI</label>
    <input type="file" id="ai-upload" accept="image/*" onchange="handleAIUpload(this)">
    <button class="tb midi" onclick="exportMIDI()">⬇ MIDI</button>
    <div class="sep"></div>
    <button class="tb danger" id="clearBtn">CLEAR</button>
  </div>
</div>

<div id="bg-controls">
  <span style="font-size:11px;color:#888;white-space:nowrap">📷 Opacity</span>
  <input type="range" id="opacity-slider" min="0" max="100" value="25" oninput="setBGOpacity(this.value)">
  <button class="tb danger" style="padding:5px 9px;font-size:11px" id="bgVerwijderBtn">✕</button>
</div>

<div id="status-msg"></div>

<div id="popup">
  <div id="popup-inner">
    <div id="popup-title">Kies nootwaarde</div>
    <div id="popup-grid"></div>
    <button id="popup-sluit" onclick="sluitPopup()">Annuleer</button>
  </div>
</div>

<script>
const PINK = "#FF2D7A";
const BLAUW = "#0066cc";
const ZWART = "#111111";

let audioCtx = null, audioUnlocked = false;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

let isPlaying = false, currentBeat = 0, playbackTimer = null;
let activeTool = "noot";
let activeDuur = 4;
let bpm = 120;
let maatTeller = 4;
let notes = [];
let ghost = null;
let isTouching = false;
let isPinching = false;
let scrollX = 0;
let zoom = 1.0;
let bgImage = null;
let bgOpacity = 0.25;
let aiBezig = false;

const MATEN = 8;
const START_MARGIN = 58;
const STAFF_TOP = 28;
const NOTE_STEP = 10;
const STAFF_LINES = [2,4,6,8,10];
const TAB_STRINGS = 4;
const BASE_TAB_GAP = 24;
const BASE_MAAT_W = 220;
const GHOST_OFFSET = 45;

function MW()  { return BASE_MAAT_W * zoom; }
function SS()  { return NOTE_STEP * zoom; }
function TG()  { return BASE_TAB_GAP * zoom; }
function TT()  { return STAFF_TOP + 16 * SS() + 35; }
function CH()  { return TT() + TAB_STRINGS * TG() + 15; }

function beatNaarX(maat, beat) {
  const stapBreedte = MW() / (maatTeller + 1);
  return START_MARGIN + maat * MW() + (beat + 1) * stapBreedte - scrollX;
}

function maatstreepX(maat) {
  return START_MARGIN + maat * MW() - scrollX;
}

function xNaarMaatBeat(clientX) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const x = (clientX - rect.left) * scaleX + scrollX - START_MARGIN;
  const maat = Math.max(0, Math.min(MATEN - 1, Math.floor(x / MW())));
  const binnenMaat = Math.max(0, x - maat * MW());
  const stapBreedte = MW() / (maatTeller + 1);
  const rawBeat = binnenMaat / stapBreedte - 1;
  const sub = duurInSubBeats(activeDuur);
  const snapped = Math.round(rawBeat * sub) / sub;
  const beat = Math.max(0, Math.min(maatTeller - 1/sub, snapped));
  return { maat: maat, beat: beat };
}

function yNaarNoteIndex(clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleY = canvas.height / rect.height;
  const canvasY = (clientY - rect.top) * scaleY;
  const effectieveY = canvasY - GHOST_OFFSET;
  const idx = Math.round((effectieveY - STAFF_TOP) / SS());
  return Math.max(0, Math.min(noteMap.length - 1, idx));
}

function duurInSubBeats(d) {
  if (d===1)  return 0.25;
  if (d===2)  return 0.5;
  if (d===4)  return 1;
  if (d===8)  return 2;
  if (d===16) return 4;
  return 1;
}

function duurInBeats(d) {
  if (d===1)  return 4;
  if (d===2)  return 2;
  if (d===4)  return 1;
  if (d===8)  return 0.5;
  if (d===16) return 0.25;
  return 1;
}

const noteMap = [
  "g/3","f/3","e/3","d/3","c/3",
  "b/2","a/2","g/2","f/2","e/2",
  "d/2","c/2","b/1","a/1","g/1","f/1","e/1"
];

const noteNamen = {
  "g/3":"G3","f/3":"F3","e/3":"E3","d/3":"D3","c/3":"C3",
  "b/2":"B2","a/2":"A2","g/2":"G2","f/2":"F2","e/2":"E2",
  "d/2":"D2","c/2":"C2","b/1":"B1","a/1":"A1","g/1":"G1","f/1":"F1","e/1":"E1"
};

const frequencies = {
  "g/3":196.00,"f/3":174.61,"e/3":164.81,"d/3":146.83,"c/3":130.81,
  "b/2":123.47,"a/2":110.00,"g/2":98.00,"f/2":87.31,"e/2":82.41,
  "d/2":73.42,"c/2":65.41,"b/1":61.74,"a/1":55.00,"g/1":49.00,"f/1":43.65,"e/1":41.20
};

const midiPitches = {
  "g/3":55,"f/3":53,"e/3":52,"d/3":50,"c/3":48,"b/2":47,"a/2":45,"g/2":43,
  "f/2":41,"e/2":40,"d/2":38,"c/2":36,"b/1":35,"a/1":33,"g/1":31,"f/1":29,"e/1":28
};

const tabMap = {
  "g/3":{s:1,f:12},"f/3":{s:1,f:10},"e/3":{s:1,f:9},"d/3":{s:1,f:7},"c/3":{s:1,f:5},
  "b/2":{s:1,f:4},"a/2":{s:1,f:2},"g/2":{s:1,f:0},"f/2":{s:2,f:3},"e/2":{s:2,f:2},
  "d/2":{s:2,f:0},"c/2":{s:3,f:3},"b/1":{s:3,f:2},"a/1":{s:3,f:0},"g/1":{s:4,f:3},
  "f/1":{s:4,f:1},"e/1":{s:4,f:0}
};

const nootWaarden = [
  { duur:1,  symbool:"𝅝",  naam:"Hele noot",    tellen:"4 tellen" },
  { duur:2,  symbool:"𝅗𝅥", naam:"Halve noot",   tellen:"2 tellen" },
  { duur:4,  symbool:"♩",  naam:"Kwartnoot",    tellen:"1 tel" },
  { duur:8,  symbool:"♪",  naam:"Achtste noot", tellen:"½ tel" },
  { duur:16, symbool:"𝅘𝅥𝅯", naam:"Zestiende",   tellen:"¼ tel" }
];

const rustWaarden = [
  { duur:1,  symbool:"▬",  naam:"Hele rust",    tellen:"4 tellen" },
  { duur:2,  symbool:"▬",  naam:"Halve rust",   tellen:"2 tellen" },
  { duur:4,  symbool:"𝄽",  naam:"Kwart rust",   tellen:"1 tel" },
  { duur:8,  symbool:"𝄾",  naam:"Achtste rust", tellen:"½ tel" },
  { duur:16, symbool:"𝄿",  naam:"Zestiende r.", tellen:"¼ tel" }
];

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const canvasArea = document.getElementById("canvas-area");

function herbereken() {
  canvas.width = window.innerWidth;
  canvas.height = canvasArea.clientHeight;
}
herbereken();
window.addEventListener("resize", function() { setTimeout(herbereken, 50); });

function zoomIn()  { zoom = Math.min(2.5, parseFloat((zoom+0.25).toFixed(2))); }
function zoomOut() { zoom = Math.max(0.4, parseFloat((zoom-0.25).toFixed(2))); }

function setTool(t) {
  activeTool = t;
  ["noot","rust","wis"].forEach(function(x) {
    const el = document.getElementById("tool-"+x);
    if (el) el.classList.toggle("active", x===t);
  });
}

function setBpm(v) {
  bpm = parseInt(v);
  document.getElementById("bpm-label").textContent = bpm + " BPM";
}

function setMaat(v) { maatTeller = parseInt(v); }

let statusTimer = null;
function setStatus(msg) {
  const el = document.getElementById("status-msg");
  el.textContent = msg;
  el.classList.add("show");
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(function() { el.classList.remove("show"); }, 2500);
}

function handleBGUpload(input) {
  const f = input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    bgImage = new Image();
    bgImage.onload = function() { setStatus("Achtergrond geladen"); };
    bgImage.src = ev.target.result;
    document.getElementById("bg-controls").classList.add("open");
  };
  reader.readAsDataURL(f);
  input.value = "";
}

function setBGOpacity(v) { bgOpacity = parseInt(v) / 100; }

document.getElementById("bgVerwijderBtn").addEventListener("touchend", function(e) {
  e.preventDefault();
  bgImage = null;
  document.getElementById("bg-controls").classList.remove("open");
  setStatus("Achtergrond verwijderd");
});

function openPopup(type) {
  setTool(type);
  const isNoot = type === "noot";
  const items = isNoot ? nootWaarden : rustWaarden;
  document.getElementById("popup-title").textContent = isNoot ? "Kies nootwaarde" : "Kies rustwaarde";
  const grid = document.getElementById("popup-grid");
  grid.innerHTML = "";
  items.forEach(function(item) {
    const div = document.createElement("div");
    div.className = "popup-item" + (item.duur === activeDuur ? " active-item" : "");
    div.innerHTML = '<div class="pi-symbool">'+item.symbool+'</div><div class="pi-naam">'+item.naam+'</div><div class="pi-tellen">'+item.tellen+'</div>';
    div.addEventListener("touchend", function(e) {
      e.preventDefault();
      activeDuur = item.duur;
      sluitPopup();
      setStatus(item.naam + " geselecteerd");
    });
    grid.appendChild(div);
  });
  document.getElementById("popup").classList.add("open");
}

function sluitPopup() { document.getElementById("popup").classList.remove("open"); }

document.getElementById("clearBtn").addEventListener("touchend", function(e) {
  e.preventDefault(); e.stopPropagation();
  notes = []; setStatus("Gewist");
});

function drawFSleutel(x, y, h) {
  ctx.save();
  ctx.strokeStyle = PINK; ctx.fillStyle = PINK;
  ctx.lineWidth = Math.max(1, h * 0.05);
  ctx.beginPath();
  ctx.arc(x + h*0.2, y + h*0.14, h*0.1, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + h*0.2, y + h*0.04);
  ctx.bezierCurveTo(x + h*0.6, y + h*0.04, x + h*0.6, y + h*0.36, x + h*0.2, y + h*0.5);
  ctx.bezierCurveTo(x - h*0.08, y + h*0.64, x + h*0.06, y + h*0.88, x + h*0.2, y + h*0.94);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x + h*0.62, y + h*0.24, h*0.038, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + h*0.62, y + h*0.36, h*0.038, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawStaff() {
  const W = canvas.width;
  const H = canvas.height;
  const ss = SS();
  const tt = TT();
  const tg = TG();

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);

  if (bgImage) {
    ctx.save();
    ctx.globalAlpha = bgOpacity;
    const ratio = bgImage.naturalHeight / bgImage.naturalWidth;
    ctx.drawImage(bgImage, 0, STAFF_TOP, W, W * ratio);
    ctx.restore();
  }

  for (let m = 0; m <= MATEN; m++) {
    const x = maatstreepX(m);
    if (x < -10 || x > W + 10) continue;
    ctx.strokeStyle = "#222";
    ctx.lineWidth = m === 0 || m === MATEN ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.moveTo(x, STAFF_TOP - 8);
    ctx.lineTo(x, tt + TAB_STRINGS * tg + 6);
    ctx.stroke();
    if (m < MATEN) {
      ctx.fillStyle = "#aaa"; ctx.font = "bold 9px Arial"; ctx.textAlign = "left";
      ctx.fillText("" + (m+1), x + 3, STAFF_TOP - 2);
    }
  }

  for (let m = 0; m < MATEN; m++) {
    const stapBreedte = MW() / (maatTeller + 1);
    for (let b = 1; b < maatTeller; b++) {
      const x = maatstreepX(m) + (b + 1) * stapBreedte;
      if (x < 0 || x > W) continue;
      ctx.strokeStyle = "#eee"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, STAFF_TOP); ctx.lineTo(x, STAFF_TOP + 10 * ss); ctx.stroke();
    }
  }

  ctx.strokeStyle = "#333"; ctx.lineWidth = 1;
  STAFF_LINES.forEach(function(i) {
    const y = STAFF_TOP + i * ss;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  });

  drawFSleutel(4, STAFF_TOP + ss * 0.8, ss * 7.5);

  ctx.font = "7px Arial"; ctx.fillStyle = "#ddd";
  noteMap.forEach(function(n, i) {
    ctx.textAlign = "right";
    ctx.fillText(noteNamen[n], START_MARGIN - 2, STAFF_TOP + i * ss + 3);
  });

  ["G","D","A","E"].forEach(function(l, i) {
    const y = tt + i * tg;
    ctx.strokeStyle = "#aaa"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillStyle = "#aaa"; ctx.font = "bold 9px Arial"; ctx.textAlign = "left";
    ctx.fillText(l, 5, y + 4);
  });

  const totBreedte = START_MARGIN + MATEN * MW();
  if (totBreedte > W) {
    const barW = Math.max(30, (W / totBreedte) * W);
    const maxScroll = totBreedte - W;
    const barX = maxScroll > 0 ? (scrollX / maxScroll) * (W - barW) : 0;
    ctx.fillStyle = "#f0f0f0"; ctx.fillRect(0, H - 4, W, 4);
    ctx.fillStyle = "#ccc"; ctx.fillRect(barX, H - 4, barW, 4);
  }

  if (isPlaying) {
    const m = Math.floor(currentBeat);
    const b = (currentBeat - m) * maatTeller;
    const x = beatNaarX(m, b);
    ctx.strokeStyle = PINK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, STAFF_TOP-8); ctx.lineTo(x, tt + TAB_STRINGS * tg + 6); ctx.stroke();
  }
}

function nootY(ni) { return STAFF_TOP + ni * SS(); }

function drawNootVorm(cx, cy, ni, duur, kleur, alpha) {
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  const ss = SS();
  const gevuld = duur >= 4;
  const isHoog = ni <= 8;
  const sLen = ss * 3.2;
  const sx = isHoog ? cx + 5 : cx - 5;
  const sy = isHoog ? cy - sLen : cy + sLen;

  ctx.beginPath();
  ctx.ellipse(cx, cy, 6.5*zoom, 4.5*zoom, -0.25, 0, Math.PI*2);
  if (gevuld) { ctx.fillStyle = kleur; ctx.fill(); }
  else { ctx.strokeStyle = kleur; ctx.lineWidth = 1.5; ctx.stroke(); }

  if (duur !== 1) {
    ctx.strokeStyle = kleur; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx, cy); ctx.lineTo(sx, sy); ctx.stroke();
  }
  if (duur === 8 || duur === 16) {
    ctx.beginPath();
    if (isHoog) { ctx.moveTo(sx, sy); ctx.bezierCurveTo(sx+12, sy+6, sx+9, sy+13, sx, sy+17); }
    else { ctx.moveTo(sx, sy); ctx.bezierCurveTo(sx-12, sy-6, sx-9, sy-13, sx, sy-17); }
    ctx.strokeStyle = kleur; ctx.lineWidth = 1.5; ctx.stroke();
  }
  if (duur === 16) {
    ctx.beginPath();
    if (isHoog) { ctx.moveTo(sx, sy+9); ctx.bezierCurveTo(sx+12, sy+15, sx+9, sy+22, sx, sy+26); }
    else { ctx.moveTo(sx, sy-9); ctx.bezierCurveTo(sx-12, sy-15, sx-9, sy-22, sx, sy-26); }
    ctx.strokeStyle = kleur; ctx.lineWidth = 1.5; ctx.stroke();
  }

  const s1y = STAFF_TOP + STAFF_LINES[0] * ss;
  const s5y = STAFF_TOP + STAFF_LINES[4] * ss;
  ctx.strokeStyle = kleur; ctx.lineWidth = 1;
  if (cy < s1y - 3) {
    for (let ly = s1y - ss; ly >= cy - ss/2; ly -= ss) {
      ctx.beginPath(); ctx.moveTo(cx-9, ly); ctx.lineTo(cx+9, ly); ctx.stroke();
    }
  }
  if (cy > s5y + 3) {
    for (let ly = s5y + ss; ly <= cy + ss/2; ly += ss) {
      ctx.beginPath(); ctx.moveTo(cx-9, ly); ctx.lineTo(cx+9, ly); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawRust(cx, duur, kleur, alpha) {
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.fillStyle = kleur; ctx.strokeStyle = kleur;
  const ss = SS();
  const midY = STAFF_TOP + 5 * ss;
  ctx.lineWidth = 1.5 * zoom;
  if (duur === 1) { ctx.fillRect(cx-9*zoom, midY-ss, 18*zoom, 5*zoom); }
  else if (duur === 2) { ctx.fillRect(cx-9*zoom, midY+2, 18*zoom, 5*zoom); }
  else if (duur === 4) {
    ctx.lineWidth = 2*zoom;
    ctx.beginPath();
    ctx.moveTo(cx+2*zoom, midY-9*zoom); ctx.lineTo(cx+6*zoom, midY-3*zoom);
    ctx.lineTo(cx-2*zoom, midY+1*zoom); ctx.lineTo(cx+4*zoom, midY+5*zoom);
    ctx.lineTo(cx, midY+10*zoom); ctx.stroke();
  } else if (duur === 8) {
    ctx.beginPath(); ctx.arc(cx+2, midY-5*zoom, 3.5*zoom, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 1.5*zoom;
    ctx.beginPath(); ctx.moveTo(cx+2, midY-5*zoom); ctx.lineTo(cx-3*zoom, midY+7*zoom); ctx.stroke();
  } else if (duur === 16) {
    ctx.beginPath(); ctx.arc(cx+2, midY-8*zoom, 3*zoom, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+2, midY-1*zoom, 3*zoom, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 1.5*zoom;
    ctx.beginPath(); ctx.moveTo(cx+2, midY-8*zoom); ctx.lineTo(cx-3*zoom, midY+7*zoom); ctx.stroke();
  }
  ctx.restore();
}

function drawNotes() {
  const tt = TT();
  const tg = TG();
  notes.forEach(function(n) {
    const x = beatNaarX(n.maat, n.beat);
    if (x < -30 || x > canvas.width + 30) return;
    if (n.isRust) {
      drawRust(x, n.duur, ZWART);
    } else {
      const ni = noteMap.indexOf(n.note);
      const y = nootY(ni);
      drawNootVorm(x, y, ni, n.duur, ZWART);
      const t = tabMap[n.note];
      if (t) {
        const ty = tt + (t.s-1) * tg;
        ctx.fillStyle = "#fff"; ctx.fillRect(x-9, ty-8, 18, 16);
        ctx.fillStyle = BLAUW; ctx.font = "bold 11px Arial"; ctx.textAlign = "center";
        ctx.fillText(t.f, x, ty+5);
      }
    }
  });
}

function drawGhost() {
  if (!ghost) return;
  const x = beatNaarX(ghost.maat, ghost.beat);
  if (ghost.isRust) {
    drawRust(x, activeDuur, PINK, 0.5);
  } else {
    const ni = noteMap.indexOf(ghost.note);
    const y = nootY(ni);
    drawNootVorm(x, y, ni, activeDuur, PINK, 0.6);
    ctx.save(); ctx.globalAlpha = 0.15; ctx.strokeStyle = PINK;
    ctx.lineWidth = 1; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(x, y+8); ctx.lineTo(x, y+GHOST_OFFSET); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawGhost();
  drawNotes();
  requestAnimationFrame(loop);
}

canvas.addEventListener("contextmenu", function(e) { e.preventDefault(); });

let touchStartX = 0, touchStartScrollX = 0;
let pinchStartDist = 0, pinchStartZoom = 1;

function getTouchDist(e) {
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    isPinching = true; isTouching = false; ghost = null;
    pinchStartDist = getTouchDist(e);
    pinchStartZoom = zoom;
    touchStartX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    touchStartScrollX = scrollX;
    return;
  }
  if (!audioUnlocked) { audioUnlocked = true; getAudio(); }
  isPinching = false; isTouching = true;
  const t = e.touches[0];
  const mb = xNaarMaatBeat(t.clientX);
  const ni = yNaarNoteIndex(t.clientY);
  if (activeTool === "wis") {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const cx = (t.clientX - rect.left) * scaleX;
    notes = notes.filter(function(n) {
      return Math.abs(beatNaarX(n.maat, n.beat) - cx) > MW() / (maatTeller+1) * 0.5;
    });
    return;
  }
  if (activeTool === "rust") {
    ghost = { maat: mb.maat, beat: mb.beat, isRust: true, duur: activeDuur };
    return;
  }
  ghost = { maat: mb.maat, beat: mb.beat, note: noteMap[ni], isRust: false, duur: activeDuur };
  playBassTone(noteMap[ni]);
}, { passive: false });

canvas.addEventListener("touchmove", function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    if (isPinching) {
      const newDist = getTouchDist(e);
      zoom = Math.max(0.4, Math.min(2.5, pinchStartZoom * (newDist / pinchStartDist)));
    }
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const maxScroll = Math.max(0, START_MARGIN + MATEN * MW() - canvas.width);
    scrollX = Math.max(0, Math.min(maxScroll, touchStartScrollX + (touchStartX - midX)));
    return;
  }
  if (!isTouching || activeTool === "wis") return;
  const t = e.touches[0];
  const mb = xNaarMaatBeat(t.clientX);
  const ni = yNaarNoteIndex(t.clientY);
  const newNote = noteMap[ni];
  if (activeTool === "rust") {
    ghost = { maat: mb.maat, beat: mb.beat, isRust: true, duur: activeDuur };
  } else {
    if (!ghost || ghost.note !== newNote) playBassTone(newNote);
    ghost = { maat: mb.maat, beat: mb.beat, note: newNote, isRust: false, duur: activeDuur };
  }
}, { passive: false });

canvas.addEventListener("touchend", function(e) {
  e.preventDefault();
  isPinching = false;
  if (isTouching && ghost && activeTool !== "wis") {
    const bestaand = notes.findIndex(function(n) {
      return n.maat === ghost.maat && Math.abs(n.beat - ghost.beat) < 0.01 &&
             (n.isRust ? ghost.isRust : n.note === ghost.note);
    });
    if (bestaand !== -1) { notes.splice(bestaand, 1); }
    else { notes.push(Object.assign({}, ghost)); }
  }
  ghost = null; isTouching = false;
}, { passive: false });

function playBassTone(noteName) {
  if (!frequencies[noteName] || !audioUnlocked) return;
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(frequencies[noteName], ac.currentTime);
    gain.gain.setValueAtTime(0, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.28, ac.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.45);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + 0.45);
  } catch(e) {}
}

function togglePlayback() {
  if (!audioUnlocked) { audioUnlocked = true; getAudio(); }
  const btn = document.getElementById("playBtn");
  if (isPlaying) {
    clearInterval(playbackTimer);
    isPlaying = false; currentBeat = 0;
    btn.textContent = "▶ PLAY"; btn.classList.remove("playing");
  } else {
    isPlaying = true; currentBeat = 0;
    btn.textContent = "⏹ STOP"; btn.classList.add("playing");
    const stap = 0.25 / maatTeller;
    const msPerStap = (60 / bpm) * stap * 1000 * maatTeller;
    playbackTimer = setInterval(function() {
      const m = Math.floor(currentBeat);
      const b = parseFloat(((currentBeat - m) * maatTeller).toFixed(4));
      notes.filter(function(n) {
        return !n.isRust && n.maat === m && Math.abs(n.beat - b) < stap * maatTeller * 0.6;
      }).forEach(function(h) { playBassTone(h.note); });
      currentBeat = parseFloat((currentBeat + stap).toFixed(6));
      if (currentBeat >= MATEN) currentBeat = 0;
    }, msPerStap);
  }
}

async function handleAIUpload(input) {
  const bestand = input.files[0];
  if (!bestand || aiBezig) return;
  aiBezig = true; setStatus("🤖 AI analyseert...");
  const reader = new FileReader();
  reader.onload = async function(ev) {
    const base64 = ev.target.result.split(",")[1];
    try {
      const response = await fetch("https://analyseertablature-dia7q5dlaq-uc.a.run.app", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ base64Foto: base64, modus: "noten" })
      });
      const data = await response.json();
      if (data.noten && data.noten.length > 0) {
        data.noten.forEach(function(n, i) {
          if (noteMap.includes(n.note)) {
            notes.push({ maat: Math.floor(i/maatTeller), beat: i%maatTeller, note: n.note, duur: n.duur||4, isRust: false });
          }
        });
        setStatus("✓ " + data.noten.length + " noten geïmporteerd!");
      } else { setStatus("Geen noten herkend."); }
    } catch(err) { setStatus("Fout bij AI."); }
    aiBezig = false; input.value = "";
  };
  reader.readAsDataURL(bestand);
}

function exportMIDI() {
  if (notes.length === 0) { setStatus("Zet eerst noten neer!"); return; }
  const PPQ = 480;
  const header = [0x4d,0x54,0x68,0x64,0x00,0x00,0x00,0x06,0x00,0x00,0x00,0x01,(PPQ>>8)&0xff,PPQ&0xff];
  function writeVLQ(v) {
    v = Math.max(0, Math.round(v));
    if (v < 128) return [v];
    const bytes = [];
    while (v > 0) { bytes.unshift(v & 0x7f); v >>= 7; }
    for (let i = 0; i < bytes.length-1; i++) bytes[i] |= 0x80;
    return bytes;
  }
  const sorted = notes.filter(function(n) { return !n.isRust; })
    .sort(function(a,b) { return (a.maat*maatTeller+a.beat)-(b.maat*maatTeller+b.beat); });
  let events = [], lastTick = 0;
  sorted.forEach(function(n) {
    const tick = Math.round((n.maat*maatTeller+n.beat)*PPQ);
    const durTicks = Math.round(duurInBeats(n.duur)*PPQ);
    const pitch = midiPitches[n.note];
    events = events.concat(writeVLQ(tick-lastTick),[0x90,pitch,0x64],writeVLQ(durTicks),[0x80,pitch,0x00]);
    lastTick = tick+durTicks;
  });
  events = events.concat([0x00,0xff,0x2f,0x00]);
  const trackTag = [0x4d,0x54,0x72,0x6b];
  const len = events.length;
  const size = [(len>>24)&0xff,(len>>16)&0xff,(len>>8)&0xff,len&0xff];
  const fullFile = new Uint8Array([...header,...trackTag,...size,...events]);
  const blob = new Blob([fullFile],{type:"audio/midi"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob); link.download = "bassline.mid"; link.click();
  setStatus("MIDI geëxporteerd!");
}

loop();
