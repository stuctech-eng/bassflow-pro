<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BassFlow Pro UI</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #f2f2f4;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* TOP BAR /
#topbar {
  height: 50px;
  background: #ffffff;
  display: flex;
  align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid #e5e5e5;
}

.title {
  font-size: 14px;
  font-weight: 600;
  color: #444;
}

/ CANVAS /
#canvas-area {
  flex: 1;
  background: #f2f2f4;
  position: relative;
}

canvas {
  background: #ffffff;
  margin: 12px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

/ FLOATING TRANSPORT /
#transport {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: #ffffff;
  border-radius: 40px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.15);
}

/ BUTTONS /
.ctrl {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #444;
}

.ctrl.play {
  background: #ff2d7a;
  color: #fff;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ctrl.play.playing {
  background: #222;
}

/ TEMPO /
#tempo-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

#tempo-slider {
  width: 120px;
}

/ FLOATING TOOLS /
#tools {
  position: fixed;
  right: 12px;
  bottom: 90px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tool-btn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: none;
  background: #ffffff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  font-size: 18px;
  cursor: pointer;
}

.tool-btn.active {
  background: #ff2d7a;
  color: #fff;
}

/ STATUS /
#status-msg {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,45,122,0.9);
  color: #fff;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  display: none;
  z-index: 100;
}
#status-msg.show {
  display: block;
}
</style>
</head>

<body>

<!-- TOP -->
<div id="topbar">
  <div class="title">BassFlow Editor</div>
</div>

<!-- CANVAS -->
<div id="canvas-area">
  <canvas id="canvas"></canvas>
</div>

<!-- FLOATING TOOLS -->
<div id="tools">
  <button class="tool-btn active" id="tool-noot" onclick="setTool('noot')">♩</button>
  <button class="tool-btn" id="tool-rust" onclick="setTool('rust')">𝄽</button>
  <button class="tool-btn" id="tool-wis" onclick="setTool('wis')">✕</button>
</div>

<!-- TRANSPORT -->
<div id="transport">
  <button class="ctrl" onclick="rewind()">⏮</button>
  <button class="ctrl play" id="playBtn" onclick="togglePlayback()">▶</button>
  <button class="ctrl" onclick="forward()">⏭</button>

  <div id="tempo-wrap">
    <span id="bpm-label">120</span>
    <input type="range" id="tempo-slider" min="40" max="240" value="120" oninput="setBpm(this.value)">
  </div>
</div>

<div id="status-msg"></div>

<script>
/ === MINIMALE KOPPELING MET JOUW BESTAANDE LOGICA === /

let activeTool = "noot";
let bpm = 120;
let isPlaying = false;

function setTool(t) {
  activeTool = t;
  ["noot","rust","wis"].forEach(id => {
    document.getElementById("tool-"+id).classList.toggle("active", id === t);
  });
}

function setBpm(v) {
  bpm = parseInt(v);
  document.getElementById("bpm-label").textContent = bpm;
}

function togglePlayback() {
  const btn = document.getElementById("playBtn");
  isPlaying = !isPlaying;

  if (isPlaying) {
    btn.classList.add("playing");
    btn.textContent = "⏹";
  } else {
    btn.classList.remove("playing");
    btn.textContent = "▶";
  }
}

function rewind() {
  setStatus("⏮ Terug");
}

function forward() {
  setStatus("⏭ Vooruit");
}

function setStatus(msg) {
  const el = document.getElementById("status-msg");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1500);
}

/ === CANVAS BASIS (blijft compatibel met jouw code) === /
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = document.getElementById("canvas-area").clientHeight;
}
resize();
window.addEventListener("resize", resize);

function loop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  / TEST VISUAL */
  ctx.fillStyle = "#ddd";
  ctx.fillRect(40,40,300,100);

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
