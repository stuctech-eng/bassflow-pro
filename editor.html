<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="color-scheme" content="light only">
  <title>BassFlow VexFlow Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; padding: 20px; }
    #status { font-size: 14px; color: #FF2D7A; font-weight: 700; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="status">Laden...</div>
  <div id="output"></div>
  <script src="vexflow.js"
    onload="init()"
    onerror="document.getElementById('status').textContent='FOUT: vexflow.js niet gevonden - zet vexflow.js in dezelfde map'">
  </script>
  <script>
    function init() {
      document.getElementById("status").textContent = "✓ VexFlow geladen!";
      const { Renderer, Stave } = Vex.Flow;
      const div = document.getElementById("output");
      const renderer = new Renderer(div, Renderer.Backends.SVG);
      renderer.resize(window.innerWidth - 40, 200);
      const context = renderer.getContext();
      const stave = new Stave(10, 40, window.innerWidth - 60);
      stave.addClef("bass").addTimeSignature("4/4");
      stave.setContext(context).draw();
    }
  </script>
</body>
</html>
