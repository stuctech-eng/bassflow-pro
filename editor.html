<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>BassFlow Editor</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
      /* Voorkomt dat de pagina naar beneden trekt (refresh) in mobiele browsers */
      overscroll-behavior-y: contain;
    }

    h3 {
      margin: 15px 0 10px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #00d4ff;
    }

    canvas {
      background: #1a1a1a;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      touch-action: none; /* Cruciaal voor pointer events */
      border-radius: 4px;
    }

    .controls {
      margin-top: 15px;
    }

    button {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:active {
      background: #00d4ff;
      color: black;
    }
  </style>
</head>
<body>

<h3>BASSFLOW EDITOR</h3>
<canvas id="canvas"></canvas>

<div class="controls">
  <button onclick="clearNotes()">Leegmaken</button>
  <p style="font-size: 12px; color: #666;">Sleep om een noot te plaatsen</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Maak het canvas breedte-vullend
canvas.width = window.innerWidth - 20;
canvas.height = 350;

let notes = [];
let ghost = null;
let isTouching = false;

// Configuratie
const step = 14; 
const staffTop = 80;
// De noten die we kunnen tekenen
const noteMap = [
  "b/5","a/5","g/5","f/5","e/5","d/5","c/5",
  "b/4","a/4","g/4","f/4","e/4","d/4","c/4",
  "b/3","a/3","g/3","f/3","e/3"
];

// Indexen van de 5 lijnen van de notenbalk (G-sleutel posities)
const staffLineIndexes = [4, 6, 8, 10, 12]; 

function drawStaff() {
  ctx.strokeStyle = "#444";
  ctx.lineWidth = 1;

  // Teken de 5 hoofdlijnen
  staffLineIndexes.forEach(index => {
    let y = staffTop + (index * (step / 2));
    ctx.beginPath();
    ctx.moveTo(10, y);
    ctx.lineTo(canvas.width - 10, y);
    ctx.stroke();
  });
}

function getNoteData(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  // Offset van 40px zodat de noot boven je vinger zweeft
  const y = clientY - rect.top - 40; 

  let index = Math.round((y - staffTop) / (step / 2));
  index = Math.max(0, Math.min(noteMap.length - 1, index));

  return {
    x: x,
    y: staffTop + index * (step / 2),
    note: noteMap[index],
    index: index
  };
}

function drawLedgerLines(x, index) {
  ctx.strokeStyle = "white";
  ctx.lineWidth = 1.5;
  const halfStep = step / 2;

  // Hulplijnen boven de balk
  if (index < 4) {
    for (let i = 4 - 2; i >= index; i -= 2) {
      let ly = staffTop + (i * halfStep);
      ctx.beginPath();
      ctx.moveTo(x - 15, ly);
      ctx.lineTo(x + 15, ly);
      ctx.stroke();
    }
  }

  // Hulplijnen onder de balk
  if (index > 12) {
    for (let i = 12 + 2; i <= index; i += 2) {
      let ly = staffTop + (i * halfStep);
      ctx.beginPath();
      ctx.moveTo(x - 15, ly);
      ctx.lineTo(x + 15, ly);
      ctx.stroke();
    }
  }
}

function drawNotes() {
  notes.forEach(n => {
    drawLedgerLines(n.x, n.index);
    
    // Nootbolletje
    ctx.beginPath();
    ctx.ellipse(n.x, n.y, 7, 5, Math.PI / -4, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    // Stok (stem)
    ctx.beginPath();
    ctx.lineWidth = 1;
    ctx.moveTo(n.x + 6, n.y);
    ctx.lineTo(n.x + 6, n.y - 35);
    ctx.stroke();
  });
}

function drawGhost() {
  if (!ghost) return;
  ctx.save();
  ctx.globalAlpha = 0.5;
  drawLedgerLines(ghost.x, ghost.index);
  
  ctx.beginPath();
  ctx.ellipse(ghost.x, ghost.y, 7, 5, Math.PI / -4, 0, Math.PI * 2);
  ctx.fillStyle = "#00d4ff";
  ctx.fill();
  ctx.restore();
}

function clearNotes() {
  notes = [];
}

// Main Loop
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawGhost();
  drawNotes();
  requestAnimationFrame(loop);
}
loop();

// Unified Pointer Events voor Muis & Touch
canvas.addEventListener("pointerdown", (e) => {
  isTouching = true;
  ghost = getNoteData(e.clientX, e.clientY);
  canvas.setPointerCapture(e.pointerId); // Zorgt dat beweging gevolgd wordt ook buiten canvas
});

canvas.addEventListener("pointermove", (e) => {
  if (!isTouching) return;
  ghost = getNoteData(e.clientX, e.clientY);
});

canvas.addEventListener("pointerup", (e) => {
  if (isTouching && ghost) {
    notes.push(ghost);
    ghost = null;
  }
  isTouching = false;
});

// Window resize opvangen
window.addEventListener("resize", () => {
  canvas.width = window.innerWidth - 20;
});
</script>

</body>
</html>
