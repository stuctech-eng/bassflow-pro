<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>BassFlow Pro - Fixed</title>
  <style>
    :root { --accent: #00d4ff; --bg: #0d0d0d; }
    body { 
      margin: 0; background: var(--bg); color: white; font-family: sans-serif; 
      overflow: hidden; position: fixed; width: 100%; height: 100%;
      touch-action: none; -webkit-user-select: none;
    }
    canvas { display: block; background: #111; touch-action: none; width: 100%; height: calc(100% - 110px); }
    
    #noteMenu {
      position: absolute; display: none; background: rgba(35, 35, 35, 0.95);
      border: 2px solid var(--accent); border-radius: 15px; padding: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 9999; width: 240px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .menu-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .m-btn { flex: 1; background: #444; border: 1px solid #555; color: white; padding: 15px 5px; border-radius: 10px; font-size: 20px; }
    .m-btn:active { background: var(--accent); color: black; }
    .del-btn { background: #800; color: white; width: 100%; border: none; padding: 15px; border-radius: 10px; font-weight: bold; margin-top: 5px; }

    .bottom-bar { 
      position: fixed; bottom: 0; width: 100%; height: 110px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: #1a1a1a; border-top: 1px solid #333; gap: 8px; padding-bottom: env(safe-area-inset-bottom);
    }
    .controls-row { display: flex; gap: 15px; }
    .btn { background: #222; border: 1px solid var(--accent); color: var(--accent); padding: 10px 25px; border-radius: 12px; font-weight: bold; }
    .bpm-container { display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 14px; }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="noteMenu">
  <div style="font-size: 12px; color: #aaa; text-align: center; margin-bottom: 10px;">OPTIES</div>
  <div class="menu-row">
    <button class="m-btn" onclick="setNoteDur(512)">𝅝</button>
    <button class="m-btn" onclick="setNoteDur(256)">𝅗𝅥</button>
    <button class="m-btn" onclick="setNoteDur(128)">𝅘𝅥</button>
    <button class="m-btn" onclick="setNoteDur(64)">𝅘𝅥𝅮</button>
  </div>
  <button class="m-btn" style="width:100%; margin-bottom:10px; font-size: 14px;" onclick="toggleRest()">RUST AAN/UIT</button>
  <button class="del-btn" onclick="deleteNote()">VERWIJDER NOOT</button>
  <button class="m-btn" style="width:100%; margin-top:10px; background:var(--accent); color:black; font-weight:bold" onclick="closeMenu()">KLAAR</button>
</div>

<div class="bottom-bar">
  <div class="bpm-container">
    <span>BPM:</span>
    <input type="range" id="bpmSlider" min="60" max="180" value="120" oninput="updateBPM(this.value)">
    <span id="bpmVal">120</span>
  </div>
  <div class="controls-row">
    <button class="btn" onclick="clearNotes()">CLEAR</button>
    <button id="playBtn" class="btn" onclick="togglePlayback()">PLAY</button>
  </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
const menu = document.getElementById("noteMenu");

// Canvas setup
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 110;
}
window.addEventListener('resize', resize);
resize();

let notes = [], ghost = null, isTouching = false, selectedNote = null;
let isPlaying = false, currentBeat = 0, nextNoteTime = 0, bpm = 120;
let longPressTimer;

const staffTop = 80, tabTop = 280, beatWidth = 55, startMargin = 60;
const noteMap = ["g/3","f/3","e/3","d/3","c/3","b/2","a/2","g/2","f/2","e/2","d/2","c/2","b/1","a/1","g/1","f/1","e/1"];
const frequencies = {"g/3":196.0,"f/3":174.61,"e/3":164.81,"d/3":146.83,"c/3":130.81,"b/2":123.47,"a/2":110.0,"g/2":98.0,"f/2":87.31,"e/2":82.41,"d/2":73.42,"c/2":65.41,"b/1":61.74,"a/1":55.0,"g/1":49.0,"f/1":43.65,"e/1":41.2};

function updateBPM(val) { bpm = val; document.getElementById('bpmVal').innerText = val; }

function playNote(freq, time) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    g.gain.setValueAtTime(0.4, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(time); osc.stop(time + 0.3);
}

function draw() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    for(let b=0; b<32; b++) {
        let x = startMargin + (b * beatWidth);
        ctx.strokeStyle = (b % 4 === 0) ? "#555" : "#222";
        ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, 450); ctx.stroke();
    }
    ctx.strokeStyle = "#444";
    [5,7,9,11,13].forEach(i => { let y = staffTop + (i*7); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); });
    
    notes.forEach(n => {
        ctx.globalAlpha = n.isRest ? 0.2 : 1.0;
        ctx.fillStyle = "white"; ctx.beginPath(); ctx.ellipse(n.x, n.y, 7, 5, -0.7, 0, 7); 
        if(n.dur >= 256) { ctx.strokeStyle="white"; ctx.stroke(); } else { ctx.fill(); }
        ctx.globalAlpha = 1.0;
    });

    if(ghost) {
        ctx.fillStyle = "rgba(0, 212, 255, 0.4)";
        ctx.beginPath(); ctx.ellipse(ghost.x, ghost.y, 7, 5, -0.7, 0, 7); ctx.fill();
    }
    
    if(isPlaying) {
        ctx.strokeStyle = varColor(currentBeat); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(startMargin + (currentBeat * beatWidth), 20); ctx.lineTo(startMargin + (currentBeat * beatWidth), 450); ctx.stroke();
    }
    requestAnimationFrame(draw);
}

function varColor(b) { return (b % 4 === 0) ? "#00d4ff" : "#ffaa00"; }

canvas.addEventListener("pointerdown", (e) => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const rect = canvas.getBoundingClientRect();
    const b = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
    const p = Math.max(0, Math.min(noteMap.length - 1, Math.round((e.clientY - rect.top - staffTop) / 7)));
    
    const hit = notes.find(n => n.beat === b && n.index === p);
    
    if(hit) {
        selectedNote = hit;
        longPressTimer = setTimeout(() => {
            showMenu(e.clientX, e.clientY);
        }, 400);
    } else {
        isTouching = true;
        ghost = { x: startMargin + (b * beatWidth), y: staffTop + p * 7, beat: b, index: p, note: noteMap[p], dur: 128, isRest: false };
        playNote(frequencies[ghost.note], audioCtx.currentTime);
    }
});

canvas.addEventListener("pointermove", (e) => {
    if(!isTouching) return;
    const rect = canvas.getBoundingClientRect();
    const b = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
    const p = Math.max(0, Math.min(noteMap.length - 1, Math.round((e.clientY - rect.top - staffTop) / 7)));
    ghost.x = startMargin + (b * beatWidth);
    ghost.y = staffTop + p * 7;
    ghost.beat = b;
    ghost.index = p;
    ghost.note = noteMap[p];
});

canvas.addEventListener("pointerup", () => {
    clearTimeout(longPressTimer);
    if(isTouching && ghost) {
        notes.push({...ghost});
    }
    ghost = null; isTouching = false;
});

function showMenu(x, y) {
    menu.style.display = "block";
    menu.style.left = Math.min(x, window.innerWidth - 250) + "px";
    menu.style.top = Math.min(y, window.innerHeight - 300) + "px";
}

function closeMenu() { menu.style.display = "none"; selectedNote = null; }
function setNoteDur(d) { if(selectedNote) selectedNote.dur = d; }
function toggleRest() { if(selectedNote) selectedNote.isRest = !selectedNote.isRest; }
function deleteNote() { notes = notes.filter(n => n !== selectedNote); closeMenu(); }
function clearNotes() { notes = []; }

function togglePlayback() {
    if(isPlaying) { isPlaying = false; document.getElementById("playBtn").innerText="PLAY"; }
    else {
        isPlaying = true; currentBeat = 0; nextNoteTime = audioCtx.currentTime;
        document.getElementById("playBtn").innerText="STOP";
        scheduler();
    }
}

function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + 0.1 && isPlaying) {
        notes.filter(n => n.beat === currentBeat && !n.isRest).forEach(n => playNote(frequencies[n.note], nextNoteTime));
        nextNoteTime += (60 / bpm);
        currentBeat++; if(currentBeat > 31) currentBeat = 0;
    }
    if(isPlaying) setTimeout(scheduler, 25);
}

draw();
</script>
</body>
</html>
