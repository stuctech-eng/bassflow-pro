<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BassFlow Editor Test</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    canvas {
      background: #222;
      margin-top: 20px;
      touch-action: none;
    }
  </style>
</head>
<body>

<h3>BassFlow - Touch Test</h3>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = 200;

let notes = [];

// teken balk
function drawStaff() {
  ctx.strokeStyle = "white";
  for (let i = 0; i < 5; i++) {
    let y = 60 + i * 15;
    ctx.beginPath();
    ctx.moveTo(10, y);
    ctx.lineTo(canvas.width - 10, y);
    ctx.stroke();
  }
}

// mapping Y → noot
function getNote(y) {
  const map = [
    { y: 60, note: "F5" },
    { y: 75, note: "D5" },
    { y: 90, note: "B4" },
    { y: 105, note: "G4" },
    { y: 120, note: "E4" },
    { y: 135, note: "C4" }
  ];

  let closest = map.reduce((a, b) =>
    Math.abs(b.y - y) < Math.abs(a.y - y) ? b : a
  );

  return closest;
}

// teken noten
function drawNotes() {
  notes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    ctx.fillText(n.note, n.x - 10, n.y - 10);
  });
}

// redraw
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawNotes();
}

// touch
canvas.addEventListener("touchstart", (e) => {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];

  const x = touch.clientX - rect.left;
  const y = touch.clientY - rect.top;

  const snapped = getNote(y);

  notes.push({
    x: x,
    y: snapped.y,
    note: snapped.note
  });

  draw();

  console.log(notes);
});

// klik (desktop test)
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const snapped = getNote(y);

  notes.push({
    x: x,
    y: snapped.y,
    note: snapped.note
  });

  draw();
});

draw();
</script>

</body>
</html>
