<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>BassFlow Pro Editor</title>
  <style>
    :root { --accent: #00d4ff; --bg: #0d0d0d; --panel: #151515; }
    body { 
      margin: 0; background: var(--bg); color: white; font-family: sans-serif; 
      text-align: center; overflow: hidden; touch-action: none; -webkit-user-select: none;
    }
    h3 { margin: 10px 0; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-size: 16px; }
    canvas { 
      background: var(--panel); display: block; margin: 0 auto; 
      touch-action: none; border-bottom: 2px solid #333; cursor: crosshair;
    }
    .controls { 
      margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; 
      gap: 8px; padding: 0 10px; touch-action: auto;
    }
    button, label { 
      background: #222; color: var(--accent); border: 1px solid var(--accent); 
      padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;
    }
    button:active, label:active { background: var(--accent); color: black; }
    .midi-btn { border-color: #ffaa00; color: #ffaa00; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<h3>BassFlow Pro Editor</h3>
<canvas id="canvas"></canvas>

<div class="controls">
  <button onclick="clearNotes()">CLEAR</button>
  <button id="playBtn" onclick="togglePlayback()">PLAY</button>
  <label for="omr-upload">📷 OMR</label>
  <input type="file" id="omr-upload" accept="image/*">
  <button class="midi-btn" onclick="exportMIDI()">⬇️ MIDI</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let isPlaying = false, currentBeat = 0, playbackInterval, omrImage = null;

const frequencies = {
  "g/3": 196.00, "f/3": 174.61, "e/3": 164.81, "d/3": 146.83, "c/3": 130.81,
  "b/2": 123.47, "a/2": 110.00, "g/2": 98.00, "f/2": 87.31, "e/2": 82.41,
  "d/2": 73.42, "c/2": 65.41, "b/1": 61.74, "a/1": 55.00, "g/1": 49.00, "f/1": 43.65, "e/1": 41.20
};

const midiPitches = {
  "g/3": 55, "f/3": 53, "e/3": 52, "d/3": 50, "c/3": 48, "b/2": 47, "a/2": 45, "g/2": 43, 
  "f/2": 41, "e/2": 40, "d/2": 38, "c/2": 36, "b/1": 35, "a/1": 33, "g/1": 31, "f/1": 29, "e/1": 28
};

const tabMap = {
  "g/3": {s:1, f:12}, "f/3": {s:1, f:10}, "e/3": {s:1, f:9}, "d/3": {s:1, f:7}, "c/3": {s:1, f:5},
  "b/2": {s:1, f:4}, "a/2": {s:1, f:2}, "g/2": {s:1, f:0}, "f/2": {s:2, f:3}, "e/2": {s:2, f:2},
  "d/2": {s:2, f:0}, "c/2": {s:3, f:3}, "b/1": {s:3, f:2}, "a/1": {s:3, f:0}, "g/1": {s:4, f:3},
  "f/1": {s:4, f:1}, "e/1": {s:4, f:0}
};

const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = 480;
let notes = [], ghost = null, isTouching = false;
const step = 14, staffTop = 80, tabTop = 280, beatWidth = 55, startMargin = 85;
const noteMap = ["g/3","f/3","e/3","d/3","c/3","b/2","a/2","g/2","f/2","e/2","d/2","c/2","b/1","a/1","g/1","f/1","e/1"];

// --- MIDI EXPORT ---
function exportMIDI() {
  if (notes.length === 0) return;
  const header = [0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x80];
  let events = [];
  const sorted = [...notes].sort((a, b) => a.beat - b.beat);
  let lastTick = 0;
  sorted.forEach(n => {
    let tick = n.beat * 128;
    events.push(tick - lastTick, 0x90, midiPitches[n.note], 0x64);
    events.push(128, 0x80, midiPitches[n.note], 0x00);
    lastTick = tick + 128;
  });
  events.push(0x00, 0xff, 0x2f, 0x00);
  const fullFile = new Uint8Array([...header, 0x4d, 0x54, 0x72, 0x6b, 0, 0, 0, events.length, ...events]);
  const blob = new Blob([fullFile], {type: "audio/midi"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "bassline.mid";
  link.click();
}

function playBassTone(noteName) {
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'triangle'; osc.frequency.setValueAtTime(frequencies[noteName], audioCtx.currentTime);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

function drawStaff() {
  if (omrImage) {
    ctx.save(); ctx.globalAlpha = 0.4;
    ctx.drawImage(omrImage, 0, 20, canvas.width, canvas.width * (omrImage.height / omrImage.width));
    ctx.restore();
  }
  for (let b = 0; b < 24; b++) {
    let x = startMargin + (b * beatWidth);
    ctx.strokeStyle = (b % 4 === 0) ? "#666" : "#222";
    ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, 420); ctx.stroke();
  }
  ctx.strokeStyle = "#888";
  [5, 7, 9, 11, 13].forEach(i => {
    let y = staffTop + (i * 7);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  });
  ctx.strokeStyle = "#444";
  [0, 1, 2, 3].forEach(i => {
    let y = tabTop + (i * 20);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  });
  if (isPlaying) {
    ctx.strokeStyle = "#ffaa00"; ctx.lineWidth = 2;
    const x = startMargin + (currentBeat * beatWidth);
    ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, 420); ctx.stroke();
    ctx.lineWidth = 1;
  }
}

function drawNotes() {
  notes.forEach(n => {
    // Balk
    ctx.beginPath(); ctx.ellipse(n.x, n.y, 7, 5, -0.7, 0, 7);
    ctx.fillStyle = "white"; ctx.fill();
    ctx.beginPath(); ctx.strokeStyle = "white"; ctx.lineWidth = 1.5;
    if (n.index <= 9) { ctx.moveTo(n.x - 6, n.y); ctx.lineTo(n.x - 6, n.y + 30); }
    else { ctx.moveTo(n.x + 6, n.y); ctx.lineTo(n.x + 6, n.y - 35); }
    ctx.stroke();
    // TAB
    const t = tabMap[n.note];
    if (t) {
      const ty = tabTop + ((t.s - 1) * 20);
      ctx.fillStyle = "#151515"; ctx.fillRect(n.x - 8, ty - 8, 16, 16);
      ctx.fillStyle = "#00d4ff"; ctx.font = "bold 13px Arial"; ctx.textAlign = "center";
      ctx.fillText(t.f, n.x, ty + 5);
    }
  });
}

function togglePlayback() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (isPlaying) { clearInterval(playbackInterval); isPlaying = false; document.getElementById("playBtn").innerText = "PLAY"; }
  else {
    isPlaying = true; currentBeat = 0; document.getElementById("playBtn").innerText = "STOP";
    const playStep = () => {
      notes.filter(n => n.beat === currentBeat).forEach(h => playBassTone(h.note));
    };
    playStep();
    playbackInterval = setInterval(() => {
      currentBeat++; if (currentBeat > 20) currentBeat = 0;
      playStep();
    }, 500);
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  if (ghost) {
    ctx.save(); ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(ghost.x, ghost.y, 7, 5, -0.7, 0, 7);
    ctx.fillStyle = "#00d4ff"; ctx.fill(); ctx.restore();
  }
  drawNotes();
  requestAnimationFrame(loop);
}

document.getElementById('omr-upload').addEventListener('change', function(e) {
  const reader = new FileReader();
  reader.onload = (ev) => { omrImage = new Image(); omrImage.src = ev.target.result; };
  reader.readAsDataURL(e.target.files[0]);
});

canvas.addEventListener("pointerdown", (e) => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  isTouching = true; canvas.setPointerCapture(e.pointerId);
  updateGhost(e);
  playBassTone(ghost.note);
});

canvas.addEventListener("pointermove", (e) => {
  if (!isTouching) return;
  const oldNote = ghost ? ghost.note : null;
  updateGhost(e);
  if (oldNote !== ghost.note) playBassTone(ghost.note);
});

canvas.addEventListener("pointerup", () => {
  if (isTouching && ghost) {
    const idx = notes.findIndex(n => n.beat === ghost.beat && n.note === ghost.note);
    if (idx !== -1) notes.splice(idx, 1);
    else notes.push(ghost);
    ghost = null;
  }
  isTouching = false;
});

function updateGhost(e) {
  const rect = canvas.getBoundingClientRect();
  const bIdx = Math.round((e.clientX - rect.left - startMargin) / beatWidth);
  const pIdx = Math.round((e.clientY - rect.top - 75 - staffTop) / 7);
  const p = Math.max(0, Math.min(noteMap.length - 1, pIdx));
  ghost = { x: startMargin + (bIdx * beatWidth), y: staffTop + p * 7, note: noteMap[p], index: p, beat: bIdx };
}

function clearNotes() { notes = []; }

// Extra iPhone Zoom Blockers
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
loop();
</script>
</body>
</html>
